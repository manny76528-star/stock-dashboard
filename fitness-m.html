<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<title>🏋️ 健身紀錄</title>
<script>
// ══ 🔐 資料密碼＋資料加密（2026/10）══
//   1) 呼叫雲端同步服務時自動帶通行碼（X-Sync-Key）；查股價、大盤不用帶
//   2) 四個資料檔上傳前自動加密（AES-256-GCM）、下載後自動解開；各頁面原本的同步程式完全不用改
//   3) 這台沒有鑰匙卻讀到加密檔 → 不交出資料、也不准上傳（避免拿舊資料蓋掉雲端），跳出輸入密碼
(function(){
  const W='https://dashboard-sync.manny76528.workers.dev', KS='syncKey_v1', KE='encKey_v1', KON='encOn_v1';
  const ENC_FILES=['data_dashboard.json','data_inventory.json','data_glove.json','data_vocab.json','data_fitness.json'];
  const SALT='stock-dashboard/manny76528-star/data-v1', ITER=600000;
  const ls={get:k=>{try{return localStorage.getItem(k)||'';}catch(e){return'';}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k);}catch(e){}}};
  const te=new TextEncoder(), td=new TextDecoder();
  async function hex(s){const b=await crypto.subtle.digest('SHA-256',typeof s==='string'?te.encode(s):s);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  const h2b=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
  const b2b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
  const b642b=b=>{const s=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
  window.syncKeyFromPw=pw=>hex('sync:'+pw);
  window.syncHashFromKey=k=>hex(k);
  window.syncGetKey=()=>ls.get(KS); window.syncSetKey=k=>ls.set(KS,k);
  window.encGetKey=()=>ls.get(KE); window.encSetKey=k=>ls.set(KE,k);
  window.encIsOn=()=>ls.get(KON)==='1'; window.encSetOn=v=>ls.set(KON,v?'1':'');
  window.encKeyFromPw=async pw=>{const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode(SALT),iterations:ITER,hash:'SHA-256'},base,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');};
  window.encKid=async k=>(await hex(h2b(k))).slice(0,8);
  const isEnv=o=>o&&typeof o==='object'&&o.enc==='v1'&&o.ct&&o.iv;
  window.encIsEnvelopeText=t=>{try{return isEnv(JSON.parse(t));}catch(e){return false;}};
  async function aes(k){return crypto.subtle.importKey('raw',h2b(k),'AES-GCM',false,['encrypt','decrypt']);}
  window.encSeal=async(plainBytes,k)=>{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aes(k),plainBytes));
    return JSON.stringify({enc:'v1',alg:'AES-256-GCM',kdf:'PBKDF2-SHA256-'+ITER,kid:await encKid(k),ts:Date.now(),iv:b2b64(iv),ct:b2b64(ct)});};
  window.encOpen=async(env,k)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b642b(env.iv)},await aes(k),b642b(env.ct)));
  const pub=u=>/^\/(price|index)(\?|$)/.test(u.slice(W.length));
  const fileOf=u=>decodeURIComponent(u.slice(W.length+1).split('?')[0]);
  const _f=window.fetch.bind(window);window._syncRawFetch=_f;
  const fail=(st,msg)=>new Response(JSON.stringify({error:msg,message:msg}),{status:st,headers:{'Content-Type':'application/json'}});
  window.fetch=async function(input,init){
    const url=typeof input==='string'?input:(input&&input.url)||'';
    if(!url.startsWith(W)||pub(url))return _f(input,init);
    const k=window.syncGetKey();
    init=Object.assign({},init||{});
    if(k){const h=new Headers(init.headers||(typeof input!=='string'&&input.headers)||{});h.set('X-Sync-Key',k);init.headers=h;}
    const file=fileOf(url), method=String(init.method||(typeof input!=='string'&&input.method)||'GET').toUpperCase(), enc=ENC_FILES.includes(file);
    if(enc&&method==='PUT'){
      try{const body=JSON.parse(init.body);const ek=window.encGetKey();
        if(ek&&window.encIsOn()){body.content=b2b64(te.encode(await encSeal(b642b(body.content),ek)));init.body=JSON.stringify(body);}
        else{ // 這台沒開加密：先看雲端是不是已經加密了，是的話不准用明文蓋掉
          const r0=await _f(W+'/'+file+'?t='+Date.now(),{headers:init.headers});
          if(r0.ok){const j0=await r0.json();if(j0&&j0.content&&isEnv(JSON.parse(td.decode(b642b(j0.content))))){setTimeout(()=>window.syncAsk('enc'),0);return fail(423,'encrypted: need key');}}}
      }catch(e){console.warn('[加密] 上傳前處理失敗',e);return fail(500,'encrypt failed');}
    }
    const r=await _f(input,init);
    if(r.status===401){setTimeout(()=>window.syncAsk(k?'wrong':'first'),0);return r;}
    if(enc&&method==='GET'&&r.ok){
      let j;try{j=await r.clone().json();}catch(e){return r;}
      if(!j||!j.content)return r;
      let env=null;try{const o=JSON.parse(td.decode(b642b(j.content)));if(isEnv(o))env=o;}catch(e){}
      if(!env)return r;
      window.encSetOn(true);
      const ek=window.encGetKey();
      if(!ek){setTimeout(()=>window.syncAsk('enc'),0);return fail(423,'encrypted: need key');}
      if(env.kid&&env.kid!==await encKid(ek)){setTimeout(()=>window.syncAsk('enckey'),0);return fail(423,'encrypted: wrong key');}
      try{const plain=await encOpen(env,ek);j.content=b2b64(plain);return new Response(JSON.stringify(j),{status:200,headers:{'Content-Type':'application/json'}});}
      catch(e){setTimeout(()=>window.syncAsk('enckey'),0);return fail(423,'decrypt failed');}
    }
    return r;
  };
  let shown=false;
  const MSG={first:['這台裝置第一次同步','輸入「資料密碼」才能讀寫雲端資料',''],wrong:['資料密碼不對或已更換','輸入「資料密碼」才能讀寫雲端資料','⚠️ 雲端拒絕了這台裝置記住的密碼，請重新輸入'],
    enc:['雲端資料已加密','輸入「資料密碼」解開這台的資料',''],enckey:['資料密碼不對或已更換','雲端資料用另一組密碼加密','⚠️ 這台記住的鑰匙解不開，請重新輸入資料密碼']};
  window.syncAsk=function(why){
    if(shown||document.getElementById('sa-bg'))return;shown=true;const M=MSG[why]||MSG.first;
    const go=()=>{const bg=document.createElement('div');bg.id='sa-bg';
      bg.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif';
      bg.innerHTML=`<div style="background:#fff;border-radius:18px;width:min(380px,100%);box-shadow:0 30px 70px rgba(0,0,0,.3);overflow:hidden">
        <div style="text-align:center;padding:22px 18px 8px;background:linear-gradient(135deg,#eff6ff,#f5f3ff)"><div style="font-size:38px">🔐</div><b style="font-size:17px;color:#0f172a">${M[0]}</b><div style="font-size:12.5px;color:#64748b;margin-top:4px">${M[1]}</div></div>
        <div style="padding:14px 18px 18px"><div style="display:flex;align-items:center;border:1.5px solid #93c5fd;border-radius:11px;padding:0 10px;box-shadow:0 0 0 3px #dbeafe"><input id="sa-pw" type="password" autocomplete="current-password" style="flex:1;border:none;outline:none;padding:11px 0;font-size:16px;background:transparent;min-width:0" placeholder="資料密碼"><span id="sa-eye" style="cursor:pointer;font-size:16px">👁</span></div>
        ${M[2]?`<div style="color:#dc2626;font-size:12.5px;margin-top:6px">${M[2]}</div>`:''}
        <div id="sa-st" style="font-size:12px;color:#64748b;margin-top:8px">輸入一次就會記在這台裝置，之後不會再問。</div>
        <div style="display:flex;gap:8px;margin-top:14px"><button id="sa-no" style="flex:1;padding:10px;border:1px solid #e2e8f0;border-radius:11px;background:#fff;color:#64748b;font-weight:700;font-size:14px;cursor:pointer">先不要</button><button id="sa-ok" style="flex:2;padding:10px;border:none;border-radius:11px;background:#2563eb;color:#fff;font-weight:800;font-size:14px;cursor:pointer">解開並同步</button></div></div></div>`;
      document.body.appendChild(bg);const pw=bg.querySelector('#sa-pw');setTimeout(()=>pw.focus(),50);
      bg.querySelector('#sa-eye').onclick=()=>{pw.type=pw.type==='password'?'text':'password';};
      bg.querySelector('#sa-no').onclick=()=>{bg.remove();};
      const ok=async()=>{if(!pw.value)return;const st=bg.querySelector('#sa-st');st.textContent='🔑 產生鑰匙中（第一次約 1–3 秒）…';
        window.syncSetKey(await window.syncKeyFromPw(pw.value));window.encSetKey(await window.encKeyFromPw(pw.value));location.reload();};
      bg.querySelector('#sa-ok').onclick=ok;pw.onkeydown=e=>{if(e.key==='Enter')ok();};};
    if(document.body)go();else document.addEventListener('DOMContentLoaded',go);
  };
})();

</script>

<script>
// ══ 🏋️ 健身紀錄：共用核心（資料、同步、統計）══
const FT_KEY='fitness_db_v1', FT_FILE='data_fitness.json', CF_WORKER='https://dashboard-sync.manny76528.workers.dev', FT_API=CF_WORKER+'/'+FT_FILE;
const GROUPS=[['chest','胸','#ef4444'],['back','背','#3b82f6'],['legs','腿','#8b5cf6'],['shoulder','肩','#f59e0b'],['bi','二頭','#10b981'],['tri','三頭','#06b6d4']];
const GN=Object.fromEntries(GROUPS.map(g=>[g[0],g[1]])), GC=Object.fromEntries(GROUPS.map(g=>[g[0],g[2]]));
// 腹肌：可以記組數、次數、負重，但不算在六個肌群圓環裡（腹肌有自己的提醒）
const ABS_G=['abs','腹肌','#0d9488'];GN.abs=ABS_G[1];GC.abs=ABS_G[2];const GROUPS_ALL=[...GROUPS,ABS_G];
const PRESETS=[['胸＋三頭',['chest','tri']],['背＋二頭',['back','bi']],['腿',['legs']],['肩',['shoulder']],['二＋三頭',['bi','tri']]];
const CARDIO=['爬坡機','跑步機','飛輪','爬梯','划船機','戶外跑','游泳'];
const DEF_EX=[
 ['chest','槓鈴臥推'],['chest','上胸臥推'],['chest','雙槓下胸',1],['chest','機器夾胸'],
 ['back','滑輪下拉'],['back','雙繩擴背下拉'],['back','單臂划船',0,'水平划船'],['back','雙臂划船',0,'水平划船'],['back','V 型划船',0,'水平划船'],
 ['legs','深蹲'],['legs','股四頭坐姿腿部伸展'],['legs','股二頭機器'],['legs','大腿內夾'],['legs','臀部外夾'],['legs','小腿提舉'],
 ['shoulder','肩推'],['shoulder','側平舉'],['shoulder','前平舉'],['shoulder','反向飛鳥'],
 ['tri','滑輪下壓'],['tri','滑輪過頭三頭屈伸'],
 ['bi','集中彎舉'],['bi','錘式彎舉']];
function ftNew(){const ex={};DEF_EX.forEach((e,i)=>{ex['e'+(i+1)]={g:e[0],n:e[1],bw:!!e[2],sub:e[3]||'',o:i,_u:1};});return{v:1,_ts:0,ex,sessions:[],inbody:[],abs:[],photos:[],_del:{}};}
let db=(()=>{try{const j=JSON.parse(localStorage.getItem(FT_KEY)||'null');if(j&&j.ex){j.abs=j.abs||[];j.photos=j.photos||[];return j;}}catch(e){}return ftNew();})();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10);};
const nowHM=()=>new Date(Date.now()+8*3600e3).toISOString().slice(11,16);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=0)=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const WK='日一二三四五六', dow=d=>new Date(d+'T00:00:00Z').getUTCDay(), md=d=>+d.slice(5,7)+'/'+ +d.slice(8,10);
// 日期統一：清單／表格用 mdd（11/09）＋wd（週一）；句子裡用 md（11/9）
const mdd=d=>d.slice(5,7)+'/'+d.slice(8,10), wd=d=>'週'+WK[dow(d)];
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);};
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5);
const monday=d=>addDays(d,-((dow(d)+6)%7));
function exList(g,all){return Object.entries(db.ex).filter(([id,e])=>e.g===g&&(all||!e.off)).sort((a,b)=>(a[1].o||0)-(b[1].o||0)).map(([id,e])=>({id,...e}));}

// ── 存檔與同步（合併：每筆記錄用 _u 比新舊、刪除用墓碑）──
function touch(o){o._u=Date.now();return o;}
function save(){db._ts=Date.now();try{localStorage.setItem(FT_KEY,JSON.stringify(db));}catch(e){}schedulePush();}
function delRec(kind,id){(db._del[kind]=db._del[kind]||{})[id]=Date.now();db[kind]=db[kind].filter(x=>x.id!==id);save();}
function mergeDb(a,b){
  const o=ftNew();o.ex={};o._del={};
  ['sessions','inbody','abs','photos'].forEach(k=>{const D={...(a._del||{})[k],...(b._del||{})[k]};o._del[k]=D;const m={};
    [...(a[k]||[]),...(b[k]||[])].forEach(x=>{if(!x||!x.id)return;if(!m[x.id]||(x._u||0)>(m[x.id]._u||0))m[x.id]=x;});
    o[k]=Object.values(m).filter(x=>!(D[x.id]&&D[x.id]>=(x._u||0))).sort((p,q)=>(p.date+(p.start||'')).localeCompare(q.date+(q.start||'')));});
  [a.ex||{},b.ex||{}].forEach(E=>Object.entries(E).forEach(([id,e])=>{if(!o.ex[id]||(e._u||0)>(o.ex[id]._u||0))o.ex[id]=e;}));
  {const DX={...(a._del||{}).ex,...(b._del||{}).ex};o._del.ex=DX;Object.keys(o.ex).forEach(id=>{if(DX[id]&&DX[id]>=(o.ex[id]._u||0))delete o.ex[id];});}
  const ca=a.cfg||{},cb=b.cfg||{};o.cfg=(ca._u||0)>=(cb._u||0)?ca:cb;
  o._ts=Math.max(a._ts||0,b._ts||0);return o;}
let _sha='',_pushT=null,_pulling=false;
const b64e=s=>{const u=new TextEncoder().encode(s);let r='';for(let i=0;i<u.length;i+=0x8000)r+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(r);};
const b64d=b=>{const s=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u);};
function syncMsg(t){const e=document.getElementById('sync');if(e)e.textContent=t;}
async function pull(){
  if(_pulling)return false;_pulling=true;
  try{const r=await fetch(FT_API+'?t='+Date.now());
    if(r.status===404){_sha='';syncMsg('☁️ 雲端還沒有資料');return false;}
    if(!r.ok){syncMsg('⚠️ 同步失敗');return false;}
    const j=await r.json();_sha=j.sha;const remote=JSON.parse(b64d(j.content));
    const before=JSON.stringify(db.sessions)+JSON.stringify(db.inbody)+JSON.stringify(db.ex)+JSON.stringify(db.abs)+JSON.stringify(db.photos);
    db=mergeDb(db,remote);try{localStorage.setItem(FT_KEY,JSON.stringify(db));}catch(e){}
    syncMsg('✅ 已同步');return before!==JSON.stringify(db.sessions)+JSON.stringify(db.inbody)+JSON.stringify(db.ex)+JSON.stringify(db.abs)+JSON.stringify(db.photos);
  }catch(e){console.warn('pull',e);syncMsg('⚠️ 離線（存在這台）');return false;}finally{_pulling=false;}}
function schedulePush(){clearTimeout(_pushT);syncMsg('⏳ 等待同步…');_pushT=setTimeout(push,1500);}
async function push(n=0){
  // 資料庫是公開的：沒有加密鑰匙就絕不上傳（只存在這台）
  if(!(window.encGetKey&&window.encGetKey())){syncMsg('🔐 輸入資料密碼後才會同步');if(window.syncAsk)window.syncAsk('enc');return;}
  if(window.encSetOn)window.encSetOn(true);
  try{
    // 先拿雲端最新的合併，避免兩台裝置互蓋
    const g=await fetch(FT_API+'?t='+Date.now());
    if(g.ok){const j=await g.json();_sha=j.sha;db=mergeDb(db,JSON.parse(b64d(j.content)));}
    else if(g.status!==404){syncMsg('⚠️ 同步失敗（存在這台）');return;}
    else _sha='';
    db._ts=Date.now();try{localStorage.setItem(FT_KEY,JSON.stringify(db));}catch(e){}
    const body={message:'fitness-sync:'+Date.now(),content:b64e(JSON.stringify(db))};if(_sha)body.sha=_sha;
    const r=await fetch(FT_API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){if(n<4){await new Promise(s=>setTimeout(s,600*(n+1)));return push(n+1);}}
    if(!r.ok){syncMsg('⚠️ 同步失敗（存在這台）');return;}
    const j=await r.json();_sha=j.content&&j.content.sha;syncMsg('✅ 已同步至雲端');
  }catch(e){console.warn('push',e);syncMsg('⚠️ 離線（存在這台，連線後再同步）');}}

// ── 計算 ──
function bwAt(d){const L=db.inbody.filter(x=>x.date<=d&&x.wt).sort((a,b)=>a.date.localeCompare(b.date));return L.length?+L[L.length-1].wt:(db.inbody.find(x=>x.wt)?.wt||0);}
const LB=0.45359237;
function wKg(s){return (+s.w||0)*(s.u==='lb'?LB:1);}
function wTxt(s,bw){if(s.w===''||s.w==null)return'?';const w=+s.w||0;if(bw&&!w)return'自重';return w+(s.u==='lb'?'P':'');}
function setTxt(s,bw){return wTxt(s,bw)+'×'+s.r;}
function setLoad(e,s,date){return (e&&e.bw?bwAt(date)+wKg(s):wKg(s));}
function e1rm(w,r){r=+r||0;w=+w||0;if(!w||!r)return 0;return r===1?w:w*(1+Math.min(r,15)/30);}
function sessStats(s){let vol=0,sets=0;const byG={};(s.items||[]).forEach(it=>{const e=db.ex[it.ex];(it.sets||[]).forEach(st=>{if(!(+st.r))return;sets++;const v=setLoad(e,st,s.date)*(+st.r);vol+=v;const g=e?e.g:'?';(byG[g]=byG[g]||{sets:0,vol:0}).sets++;byG[g].vol+=v;});});
  const c=(s.cardio||[]).reduce((a,x)=>({min:a.min+(+x.min||0),km:a.km+(+x.km||0),kcal:a.kcal+(+x.kcal||0)}),{min:0,km:0,kcal:0});return{vol,sets,byG,...c};}
// 只算真的有做組的部位（開始時多勾、或開了沒練的那場，都不算進月曆／統計）
function sessGroups(s){const act=new Set();(s.items||[]).forEach(it=>{const e=db.ex[it.ex];if(e&&(it.sets||[]).some(x=>+x.r))act.add(e.g);});const g=act;return GROUPS.map(x=>x[0]).filter(k=>g.has(k));}
function sessTitle(s){let g=sessGroups(s);if(!g.length&&!s.end)g=GROUPS.map(x=>x[0]).filter(k=>(s.groups||[]).includes(k));const p=PRESETS.find(p=>p[1].length===g.length&&p[1].every(x=>g.includes(x)));let t=p?p[0]:g.map(k=>GN[k]).join('＋');if((s.items||[]).some(it=>db.ex[it.ex]?.g==='abs'&&(it.sets||[]).some(x=>+x.r))||(!s.end&&(s.groups||[]).includes('abs')&&!sessGroups(s).length))t=t?t+'＋腹肌':'腹肌';if(!t&&(s.cardio||[]).length)t='有氧';else if((s.cardio||[]).length)t+='＋有氧';return t||'訓練';}
// 某動作上一次（在 beforeDate 之前、或同一天但不同場）的組
function lastSets(exId,beforeDate,exceptId){const L=db.sessions.filter(s=>s.id!==exceptId&&s.date<=beforeDate&&(s.items||[]).some(it=>it.ex===exId&&(it.sets||[]).some(x=>+x.r))).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));
  if(!L.length)return null;const s=L[L.length-1];return{date:s.date,sets:s.items.find(it=>it.ex===exId).sets.filter(x=>+x.r)};}
function lastGroup(g,beforeDate,exceptId){const L=db.sessions.filter(s=>s.id!==exceptId&&s.date<=beforeDate&&sessGroups(s).includes(g)).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));return L.length?L[L.length-1]:null;}
// 每個動作的歷史最佳（估算 1RM、最重）
function exHistory(exId){const e=db.ex[exId];return db.sessions.filter(s=>(s.items||[]).some(it=>it.ex===exId)).map(s=>{const st=s.items.find(it=>it.ex===exId).sets.filter(x=>+x.r);
  let best=0,top=0,vol=0;st.forEach(x=>{const L=setLoad(e,x,s.date);best=Math.max(best,e1rm(L,x.r));top=Math.max(top,wKg(x));vol+=L*(+x.r);});return{date:s.date,id:s.id,best,top,vol,sets:st};}).filter(x=>x.sets.length).sort((a,b)=>a.date.localeCompare(b.date));}
function prsIn(from,to){const out=[];Object.keys(db.ex).forEach(id=>{const H=exHistory(id);let mx=0;H.forEach(h=>{if(h.best>mx+0.01){if(mx>0&&h.date>=from&&h.date<=to)out.push({ex:id,date:h.date,best:h.best,prev:mx,top:h.top});mx=h.best;}});});return out;}

// ── 文字匯入：「2026/10/30（胸）」＋「動作：60×10、60×10」或「動作：8、9、8」──
const EX_ALIAS={'平板臥推':'槓鈴臥推','槓鈴平板臥推':'槓鈴臥推','臥推':'槓鈴臥推','機器上胸':'上胸臥推','上胸':'上胸臥推','下胸':'雙槓下胸','夾胸':'機器夾胸','腿後勾':'股二頭機器','機械腿後勾':'股二頭機器','機器腿後勾':'股二頭機器','腿部伸展':'股四頭坐姿腿部伸展','機械肩推':'肩推','機器肩推':'肩推','啞鈴肩推':'肩推','啞鈴側平舉':'側平舉','啞鈴前平舉':'前平舉','握推':'臥推'};
function _exNorm(n){return String(n).replace(/\s/g,'').replace(/握推/g,'臥推').replace(/灣舉/g,'彎舉').replace(/[vV]行/g,'V型').replace(/V 型/g,'V型');}
function findEx(name){
  const raw=_exNorm(name), all=Object.entries(db.ex);
  const by=n=>all.find(([id,e])=>_exNorm(e.n)===_exNorm(n));
  let hit=by(raw)||(EX_ALIAS[raw]&&by(EX_ALIAS[raw]));if(hit)return hit[0];
  const strip=s=>_exNorm(s).replace(/^(槓鈴|啞鈴|機器|機械|器械|纜繩|滑輪)/,'').replace(/^平板/,'');
  hit=all.find(([id,e])=>strip(e.n)===strip(raw))||(EX_ALIAS[strip(raw)]&&by(EX_ALIAS[strip(raw)]))||all.find(([id,e])=>strip(e.n).includes(strip(raw))||strip(raw).includes(strip(e.n)));
  return hit?hit[0]:null;}
function parseImport(text){
  const out=[],warn=[];let cur=null;const GMAP={'胸':'chest','背':'back','腿':'legs','肩':'shoulder','二頭':'bi','三頭':'tri','手臂':null};
  String(text).split(/\n|。/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    if(/^【[^】]*】$/.test(line)||/^🏋️|^共 \d+ 次|^🧘/.test(line))return; // 複製出來的清單：肌群標題、表頭略過
    const d=line.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\s*(?:[（(]([^）)]*)[）)])?/);
    if(d){cur={date:`${d[1]}-${String(d[2]).padStart(2,'0')}-${String(d[3]).padStart(2,'0')}`,label:d[4]||'',groups:[],items:[],cardio:[]};
      (d[4]||'').split(/[＋+、,，\/]/).forEach(g=>{g=g.trim();if(GMAP[g])cur.groups.push(GMAP[g]);});out.push(cur);return;}
    const m=line.match(/^(.+?)[：:]\s*(.+)$/);if(!m||!cur){warn.push('看不懂：'+line);return;}
    // 有氧：「跑步機：25分、1.5公里、206kcal」
    const ct=CARDIO.find(c=>m[1].replace(/\s/g,'').includes(c))||(/有氧|走路|快走|跑步|單車|腳踏車/.test(m[1])?m[1].trim():null);
    if(ct){const v=m[2],g=re=>{const x=v.match(re);return x?+x[1]:'';};
      const c={id:uid(),type:ct,min:g(/(\d+(?:\.\d+)?)\s*(?:分|min)/i),km:g(/(\d+(?:\.\d+)?)\s*(?:公里|km)/i),kcal:g(/(\d+(?:\.\d+)?)\s*(?:kcal|大卡|卡)/i)};
      if(c.min===''&&c.km===''&&c.kcal===''){warn.push(`${cur.date} ${m[1]} 看不懂：${v}（例：25分、1.5公里、206kcal）`);return;}cur.cardio.push(c);return;}
    const id=findEx(m[1]);if(!id){warn.push(`${cur.date} 找不到動作「${m[1]}」（可以先到動作清單新增）`);return;}
    const sets=m[2].split(/[、,，\s]+/).filter(Boolean).map(t=>{const x=t.match(/^(\d+(?:\.\d+)?)\s*([pP磅]|kg|KG|公斤)?\s*[×xX*]\s*(\d+)$/);if(x)return /^[pP磅]$/.test(x[2]||'')?{w:+x[1],u:'lb',r:+x[3]}:{w:+x[1],r:+x[3]};const z=t.match(/^自重\s*[×xX*]\s*(\d+)$/);if(z)return{w:0,r:+z[1]};const y=t.match(/^(\d+)$/);return y?{w:'',r:+y[1]}:null;});
    if(sets.some(s=>!s)){warn.push(`${cur.date} ${m[1]} 有看不懂的組：${m[2]}`);}
    const ok=sets.filter(Boolean);if(!ok.length)return;if(db.ex[id].bw)ok.forEach(x=>{if(x.w==='')x.w=0;});
    const it=cur.items.find(x=>x.ex===id);if(it)it.sets.push(...ok);else cur.items.push({ex:id,sets:ok,done:true,src:m[1]});
    const g=db.ex[id].g;if(!cur.groups.includes(g))cur.groups.push(g);});
  return{sessions:out.filter(s=>s.items.length||s.cardio.length),warn};}
function importKey(s){return s.date+'|'+(s.cardio||[]).map(c=>c.type+c.min+'/'+c.km+'/'+c.kcal).join(',')+'|'+s.items.map(it=>it.ex+':'+it.sets.map(x=>(x.w===''?'':x.w)+(x.u==='lb'?'P':'')+'x'+x.r).join(',')).join(';');}
function doImport(P){let n=0,skip=0;P.sessions.forEach(s=>{const k=importKey(s);if(db.sessions.some(z=>z.ik===k)){skip++;return;}
  s.items.forEach(it=>{if(it.sets.some(x=>x.u==='lb')&&db.ex[it.ex].u!=='lb'){db.ex[it.ex].u='lb';touch(db.ex[it.ex]);}});db.sessions.push(touch({id:uid(),date:s.date,start:'',end:'匯入',groups:s.groups,items:s.items.map(it=>({ex:it.ex,sets:it.sets,done:true})),cardio:(s.cardio||[]).map(c=>({...c,id:uid()})),note:'',ik:k}));n++;});save();return{n,skip};}

// ── 期間＆彙總（網頁、手機、教練報告共用）──
function range(per,ref){if(per==='w'){const a=monday(ref);return[a,addDays(a,6)];}if(per==='m'){const a=ref.slice(0,8)+'01';const d=new Date(a+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+1);d.setUTCDate(0);return[a,d.toISOString().slice(0,10)];}const y=ref.slice(0,4);return[y+'-01-01',y+'-12-31'];}
function agg(a,b){const L=db.sessions.filter(s=>s.date>=a&&s.date<=b);const o={cnt:0,vol:0,sets:0,min:0,km:0,kcal:0,byG:{},days:new Set()};
  L.forEach(s=>{const S=sessStats(s);if(S.sets)o.cnt++;o.vol+=S.vol;o.sets+=S.sets;o.min+=S.min;o.km+=S.km;o.kcal+=S.kcal;if(S.sets||S.min)o.days.add(s.date);Object.entries(S.byG).forEach(([g,v])=>{(o.byG[g]=o.byG[g]||{sets:0,vol:0}).sets+=v.sets;o.byG[g].vol+=v.vol;});});
  const I=db.inbody.filter(x=>x.date>=a&&x.date<=b).sort((p,q)=>p.date.localeCompare(q.date));const li=I[I.length-1];['wt','mm','fat','bmr'].forEach(k=>{const z=I.filter(x=>x[k]!==''&&x[k]!=null);o[k]=z.length?+z[z.length-1][k]:null;});o.ib=li;o.list=L;return o;}

// ── 該練哪裡（隔幾天＝實際日曆天數，週末也算恢復日；每次練到都歸零重算——加練、週末練也算）──
const TRAIN_DOW=[1,2,3,4,5],DUE_REC={chest:4,back:4,legs:4,shoulder:4,bi:4,tri:4},DUE_W=8,DUE_R=8; // 💤 0～3 天恢復中、✓ 4～7 天可以練、⚠️ 8 天以上太久
const wkStart=d=>addDays(d,-((dow(d)+6)%7));
function trainDays(a,b){let n=0;for(let d=addDays(a,1);d<=b;d=addDays(d,1))if(TRAIN_DOW.includes(dow(d)))n++;return n;}
function groupDue(g,T){T=T||today();const D=[...new Set(db.sessions.filter(s=>s.date<=T&&sessGroups(s).includes(g)).map(s=>s.date))].sort();
  const name=(GROUPS.find(x=>x[0]===g)||[])[1],rec=DUE_REC[g]||2;
  if(!D.length)return{g,name,n:null,rank:4,cls:'r',dates:[],anchor:null,last:null,wk:0,rec};
  const last=D[D.length-1],anchor=last,n=dayDiff(T,anchor),wk=D.filter(d=>d>=wkStart(T)).length;
  const rank=n>=DUE_R?3:n>=DUE_W?2:n>=rec?1:0;
  return{g,name,n,rank,cls:['rest','go','w','r'][rank],dates:D,anchor,last,wk,rec};}
function dueList(T){return GROUPS.map(x=>groupDue(x[0],T)).sort((a,b)=>b.rank-a.rank||(b.n??99)-(a.n??99)||GROUPS.findIndex(x=>x[0]===a.g)-GROUPS.findIndex(x=>x[0]===b.g));}
// 今天建議：從預設組合挑整體最該練的（每個部位：等級×10＋隔幾天，取平均；有部位還在恢復中的組合扣分）
// 今天訓練項目：先挑最該練的大肌群（胸／背／腿／肩）；它的搭配小肌群（背→二頭、胸→三頭）也可以練、而且隔得一樣久才一起練
const SG_BIG=['chest','back','legs','shoulder'],SG_PAIR={back:'bi',chest:'tri',bi:'back',tri:'chest'};
function suggestPreset(T){const L=dueList(T),M={};L.forEach(x=>M[x.g]=x);const key=x=>x.rank*100+(x.n??99);
  let main=L.filter(x=>SG_BIG.includes(x.g)).sort((a,b)=>key(b)-key(a))[0];const small=L.filter(x=>!SG_BIG.includes(x.g)).sort((a,b)=>key(b)-key(a))[0];
  if(small&&main&&small.rank>main.rank)main=small;if(!main)return null;
  const p=M[SG_PAIR[main.g]],gs=[main.g];if(p&&p.rank>=1&&(p.rank>=main.rank||(p.n??99)>=(main.n??99)-2))gs.push(p.g);
  const order=GROUPS.map(g=>g[0]);gs.sort((a,b)=>SG_BIG.includes(a)===SG_BIG.includes(b)?order.indexOf(a)-order.indexOf(b):SG_BIG.includes(a)?-1:1);
  return{name:gs.map(g=>GN[g]).join('＋'),groups:gs,items:gs.map(g=>M[g])};}

  if(!confirm(`「${e.n}」改成${e.bw?'一般器材（填重量）':'自重動作（重量＝額外負重）'}？${n?`\n\n⚠️ 這個動作已經有 ${n} 次訓練紀錄，報告裡的重量計算會跟著改。`:''}`))return;

// ══ 📄 教練報告：計算＋文字清單（網頁、手機共用）══
const RP_NAME='阿豪訓練計劃';
let RPM=(()=>{const t=today();if(+t.slice(8)<=5){const d=new Date(t.slice(0,8)+'01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()-1);return d.toISOString().slice(0,7);}return t.slice(0,7);})();

function rpPrevMonth(m,n=-1){const d=new Date(m+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);return d.toISOString().slice(0,7);}
function rpRange(m){const[a,b]=range('m',m+'-01');const e=b<today()?b:today();return{a,b,e,days:Math.max(1,dayDiff(e,a)+1)};}
const rpHasW=(e,s)=>e&&e.bw?true:!(s.w===''||s.w==null);
// 某段期間：每個肌群的每次訓練（日期＋那天這個肌群的動作）
function rpGroupRows(a,e){const out={};GROUPS.forEach(g=>out[g[0]]=[]);
  db.sessions.filter(s=>s.date<=e).sort((p,q)=>(p.date+(p.start||'')).localeCompare(q.date+(q.start||''))).forEach(s=>{const by={};
    (s.items||[]).forEach(it=>{const ex=db.ex[it.ex];if(!ex)return;const st=(it.sets||[]).filter(x=>+x.r);if(!st.length)return;(by[ex.g]=by[ex.g]||[]).push({ex:it.ex,e:ex,sets:st});});
    Object.entries(by).forEach(([g,items])=>{if(out[g])out[g].push({date:s.date,sid:s.id,items,inP:s.date>=a});});});
  return out;}
function rpStats(m){
  const R=rpRange(m),{a,e}=R,wk=R.days/7,A=agg(a,e);const pm=rpPrevMonth(m),PR=range('m',pm+'-01'),P=agg(PR[0],addDays(PR[0],R.days-1));
  const GR=rpGroupRows(a,e),G={};
  GROUPS.forEach(([k])=>{const all=GR[k],rows=all.filter(r=>r.inP);let prev=null;const dates=[];
    all.forEach(r=>{if(r.inP){r.gap=prev?dayDiff(r.date,prev):null;}if(prev!==r.date)prev=r.date;});
    rows.forEach(r=>{if(!dates.includes(r.date))dates.push(r.date);});
    const reps=[],sets=rows.reduce((n,r)=>n+r.items.reduce((x,i)=>x+i.sets.length,0),0);rows.forEach(r=>r.items.forEach(i=>i.sets.forEach(x=>reps.push(+x.r))));
    const gaps=rows.map(r=>r.gap).filter(x=>x!=null&&x>0);const last=dates[dates.length-1]||null,sinceLast=last?dayDiff(e,last):null;
    const before=all.filter(r=>!r.inP).pop();
    const mx=Math.max(0,...gaps,sinceLast||0, !dates.length&&before?dayDiff(e,before.date):0);
    reps.sort((x,y)=>x-y);const q=p=>reps.length?reps[Math.min(reps.length-1,Math.floor(p*(reps.length-1)+.5))]:0;
    const sh=f=>reps.length?reps.filter(f).length/reps.length:0;
    let tag='';if(reps.length){if(sh(r=>r>15)>=.3)tag='hi';else if(sh(r=>r<=5)>=.5)tag='str';else if(sh(r=>r>=6&&r<=12)>=.6)tag='hyp';}
    const jumpy=rows.some(r=>r.items.some(i=>{const v=i.sets.map(x=>+x.r);return Math.max(...v)-Math.min(...v)>=10;}));
    G[k]={rows,dates,sets,wsets:sets/wk,freq:dates.length/wk,avgGap:gaps.length?gaps.reduce((x,y)=>x+y,0)/gaps.length:null,maxGap:mx,last:last||(before?before.date:null),lastIn:!!last,lo:q(.1),hi:q(.9),tag,jumpy};});
  // 各動作
  const EX=[];Object.keys(db.ex).forEach(id=>{const H=exHistory(id).filter(h=>h.date>=a&&h.date<=e);if(!H.length)return;const ex=db.ex[id];
    const all=H.flatMap(h=>h.sets),noW=all.filter(x=>!rpHasW(ex,x)).length,B=H.filter(h=>h.best>0);
    let top=null;all.forEach(x=>{if(rpHasW(ex,x)&&(!top||wKg(x)>wKg(top)||wKg(x)===wKg(top)&&+x.r>+top.r))top=x;});
    const f=B[0],l=B[B.length-1],d=B.length>=2?(l.best-f.best)/f.best*100:null;

function walkEdit(){const W=walkCfg();const v=prompt(`你的固定走速（格式：分鐘,公里,大卡）\n例如 26,1.6,200`,`${W.min},${W.km},${W.kcal}`);if(v==null)return;const a=v.split(/[,，\s]+/).map(Number);
  if(a.length<3||a.some(x=>!(x>0))){alert('格式不對，要像 26,1.6,200');return;}db.cfg=touch({...(db.cfg||{}),walk:{type:W.type,min:a[0],km:a[1],kcal:a[2]}});save();if(typeof render==='function')render();}
function walkAdd(m,D0){D0=D0||today();const W=walkCfg(),C=walkCalc(m),c={id:uid(),type:W.type,min:+m,km:C.km,kcal:C.kcal,auto:1};
  let s=db.sessions.find(z=>z.date===D0&&!z.end);if(!s)s=db.sessions.find(z=>z.date===D0&&z.end==='有氧');
  if(!s){s={id:uid(),date:D0,start:D0===today()?nowHM():'',end:'有氧',groups:[],items:[],cardio:[],note:''};db.sessions.push(s);}
  c.at=D0===today()?nowHM():'';(s.cardio=s.cardio||[]).push(c);touch(s);save();return c;}
function walkDel(id){const s=db.sessions.find(z=>(z.cardio||[]).some(c=>c.id===id));if(!s)return;s.cardio=s.cardio.filter(c=>c.id!==id);touch(s);
  if(s.end==='有氧'&&!s.cardio.length&&!(s.items||[]).length)delRec('sessions',s.id);else save();}
function walkDay(D0){return db.sessions.filter(z=>z.date===D0).flatMap(z=>(z.cardio||[]).filter(c=>+c.min||+c.km||+c.kcal).map(c=>({...c,start:z.start})));}
// 以前記成「跑步機」的，一次改成「爬坡機」
function walkOldN(){return db.sessions.reduce((a,s)=>a+(s.cardio||[]).filter(c=>c.type==='跑步機').length,0);}
function walkMigrate(){const n=walkOldN();if(!n)return;if(!confirm(`把以前 ${n} 筆「跑步機」都改成「爬坡機」？`))return;db.sessions.forEach(s=>{let ch=0;(s.cardio||[]).forEach(c=>{if(c.type==='跑步機'){c.type='爬坡機';ch=1;}});if(ch)touch(s);});db.cfg=touch({...(db.cfg||{}),walkMig:1});save();if(typeof render==='function')render();}
// 下一個訓練日＝明天（週末也可以練）；標籤：今天／明天／週X
function nextTrainDay(T){return addDays(T,1);}
function dayLab(d,T){return d===T?'今天':d===addDays(T,1)?'明天':'週'+WK[dow(d)];}
// 首頁大卡要顯示哪一天的訓練項目：今天練完了→明天；否則今天（週末也一樣顯示今天建議）
function heroPlan(T){T=T||today();const DN=todayDone(T);const d=DN?nextTrainDay(T):T;return{d,lab:dayLab(d,T),DN,SG:suggestPreset(d)};}

</script>
<script>
// ══ 手機：快速輸入 ══
let SDATE=null, V='home', CUR=null, OPEN=null, PICK=new Set(), PICKC=new Set(), CARD=null;
const EMBED=/embed=1/.test(location.search);if(EMBED){document.body.classList.add('embed');document.getElementById('closeEmbed').style.display='';}
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600);}
function sess(id){return db.sessions.find(s=>s.id===id);}
function openSess(){return db.sessions.filter(s=>!s.end&&dayDiff(today(),s.date)<=1).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start))[0];}
function bar(html){$('bar').style.display=html?'':'none';$('barIn').innerHTML=html||'';}
// 自動結束動作：離開這場訓練的畫面、或打開別的動作時，幫忙按「這個動作結束」（空白預填組清掉，有填的組標成完成）
function autoDoneEx(){if(!OPEN||!CUR)return;const s=sess(CUR);if(!s){OPEN=null;return;}cleanEx();const it=s.items.find(x=>x.ex===OPEN);if(it&&it.sets.length){it.done=true;touch(s);save();}OPEN=null;try{localStorage.removeItem('ft_open');}catch(e){}}
function go(v,arg){if(OPEN&&(v!=='sess'||arg!==CUR))autoDoneEx();V=v;if(v==='sess'){CUR=arg;}window.scrollTo(0,0);render();}
function render(){({home:vHome,sess:vSess,cardio:vCardio,inbody:vInbody,hist:vHist,mgr:vMgr})[V]();}

// ── 首頁：今天練什麼 ──
function vHome(){
  $('ttl').textContent='🏋️ 健身';
  const o=openSess();
  const hints=[...PICK].map(g=>{const D0=SDATE||today(),L=lastGroup(g,D0);if(!L)return`<div>💡 <b>${GN[g]}</b>：還沒有紀錄</div>`;
    const top=(L.items||[]).filter(it=>db.ex[it.ex]?.g===g&&(it.sets||[]).some(x=>+x.r)).slice(0,2).map(it=>`${esc(db.ex[it.ex].n)} ${it.sets.filter(x=>+x.r).map(x=>setTxt(x,db.ex[it.ex].bw)).join('→')}`).join('<br>');
    return`<div>💡 上次練<b>${GN[g]}</b>：${md(L.date)}（${dayDiff(D0,L.date)?dayDiff(D0,L.date)+' 天前':'同一天'}）<div class=mu>${top}</div></div>`;}).join('');
  const rec=db.sessions.slice(-4).reverse();
  $('app').innerHTML=`
  ${o?`<div class="card" style="border-color:#93c5fd;background:#eff6ff" onclick="go('sess','${o.id}')"><b>▶ 訓練進行中：${esc(sessTitle(o))}</b><div class=mu>${md(o.date)} ${o.start} 開始・點這裡繼續</div></div>`:''}
  ${hints?`<div class="hint">${hints}</div>`:''}
  <div class="mu" style="margin:14px 0 6px">有氧（可以跟重訓一起，也可以只做有氧）</div>
  ${(()=>{const D0=SDATE||today(),W=walkCfg(),L=walkDay(D0),on=walkOldN();
    return`<div class="cq"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:20px">🏃</span><b>${esc(W.type)}快速記一筆</b><span class=mu style="margin-left:auto">點分鐘記一筆（會先確認）</span></div>
     <div class="wmins">${WALK_MINS.map(m=>{const C=walkCalc(m);return`<span class="${m===W.min?'base':''}" onclick="wAsk(${m})">${m}<small>${C.km}km・${C.kcal}卡</small></span>`;}).join('')}<span class="x" onclick="wOther()">其他<small>自己輸入</small></span></div>
     <div class=mu>你的走速：<b class=mono>${W.min} 分＝${W.km} km、${W.kcal} 大卡</b>　<a class="wlk" onclick="walkEdit()">改</a></div>
     ${L.length?`<div class="wdone"><b>${D0===today()?'今天':md(D0)}已記 ${L.length} 筆</b>${L.map(c=>`<div>${c.at||c.start||''} ${esc(c.type)} <b class=mono>${c.min||'—'} 分</b> <span class=mu>${c.km||'—'} km・${c.kcal||'—'} 卡</span> <a class="wdl" onclick="wDel('${c.id}')">刪</a></div>`).join('')}</div>`:''}
     ${walkWeekHtml(D0)}
     ${on&&!(db.cfg||{}).walkMig?`<div class=mu style="margin-top:6px">以前有 ${on} 筆記成「跑步機」　<a class="wlk" onclick="walkMigrate()">都改成爬坡機</a></div>`:''}</div>`;})()}
  <div class="chips">${CARDIO.map(c=>`<span class="chip${PICKC.has(c)?' on':''}" onclick="pickC('${c}')">${PICKC.has(c)?'✓ ':''}${c}</span>`).join('')}</div>
  <div class="h" style="margin-top:20px">其他</div>
  <div class="q"><div onclick="go('inbody')"><span>📊</span>InBody</div><div onclick="go('hist')"><span>📒</span>訓練紀錄</div><div onclick="go('mgr')"><span>⚙️</span>動作清單</div></div>
  ${rec.length?`<div class="h">最近</div>${rec.map(liSess).join('')}`:''}`;
  bar(`<button class="btn pri" style="${PICK.size||PICKC.size?'':'opacity:.55'}" onclick="startSess()">開始訓練 →</button>`);
}
// 爬坡機本週長條：每次一格疊起來（先走的在下面），高度依分鐘等比例
function walkWeekHtml(D0){const m=addDays(D0,-((dow(D0)+6)%7)),sum=a=>a.reduce((p,q)=>p+q,0);
  const D=[...Array(7)].map((_,i)=>{const d=addDays(m,i);return{d,L:walkDay(d).map(c=>+c.min||0).filter(v=>v>0)};});
  const n=D.reduce((a,x)=>a+x.L.length,0),mn=D.reduce((a,x)=>a+sum(x.L),0),mx=Math.max(50,...D.map(x=>sum(x.L)));
  return`<div class="wsum">🗓️ ${D0===today()||D.some(x=>x.d===today())?'本週':md(m)+' 那週'} <b>${n} 次</b>・${+mn.toFixed(1)} 分・${D.filter(x=>x.L.length).length} 天</div><div class="wst">${D.map((x,i)=>`<div>${x.L.length?`<div class="col${x.d===D0?' t':''}">${x.L.map(v=>`<u style="height:${Math.max(17,v/mx*96).toFixed(0)}px">${+v.toFixed(1)}</u>`).join('')}</div>`:'<div class="em"></div>'}<span class="dl${x.d===D0?' t':''}">${WK[dow(x.d)]}</span></div>`).join('')}</div>`;}
function wAsk(m){const C=walkCalc(m),D0=SDATE||today();if(!confirm(`確定${D0===today()?'':'在 '+md(D0)+' '}記一筆 ${walkCfg().type} ${m} 分（${C.km} km・${C.kcal} 卡）？`))return;wQuick(m);}
function wQuick(m){const D0=SDATE||today();const c=walkAdd(m,D0);toast(`✅ 記好了：${c.type} ${c.min} 分・${c.km} km・${c.kcal} 大卡`);render();}
function wOther(){const D0=SDATE||today();const v=prompt('爬坡機幾分鐘？（公里、大卡會自動算）','');if(v==null)return;const m=parseFloat(v);if(!(m>0)){alert('請輸入分鐘數');return;}wQuick(m);}
function wDel(id){if(!confirm('刪掉這筆有氧？'))return;walkDel(id);render();}
function lastCardio(){const L=db.sessions.slice().sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));for(let i=L.length-1;i>=0;i--){const c=(L[i].cardio||[]).filter(c=>+c.min||+c.km||+c.kcal);if(c.length)return c[c.length-1];}return null;}
function repeatCardio(){const lc=lastCardio();if(!lc)return;const D0=SDATE||today();const c={id:uid(),type:lc.type,min:lc.min,km:lc.km,kcal:lc.kcal};
  let s=db.sessions.find(z=>z.date===D0&&!z.end);if(!s)s=db.sessions.find(z=>z.date===D0&&z.end==='有氧');
  if(!s){s={id:uid(),date:D0,start:D0===today()?nowHM():'',end:'有氧',groups:[],items:[],cardio:[],note:''};db.sessions.push(s);}
  (s.cardio=s.cardio||[]).push(c);touch(s);save();toast(`✅ ${D0===today()?'今天':md(D0)}記了一筆 ${lc.type} ${lc.min||''} 分`);render();}
function pickPreset(s){const a=s.split(',');const same=a.length===PICK.size&&a.every(g=>PICK.has(g));PICK=new Set(same?[]:a);render();}
function pickG(g){PICK.has(g)?PICK.delete(g):PICK.add(g);render();}
function pickC(c){PICKC.has(c)?PICKC.delete(c):PICKC.add(c);render();}
function startSess(){
  if(!PICK.size&&!PICKC.size){toast('先點上面要練的部位（或有氧）');document.querySelector('.chips')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
  try{
  const D0=SDATE||today(),past=D0!==today();const s=touch({id:uid(),date:D0,start:past?'':nowHM(),end:'',groups:[...PICK],items:[],cardio:[...PICKC].map(t=>({id:uid(),type:t,min:'',km:'',kcal:''})),note:''});
  db.sessions.push(s);save();PICK=new Set();PICKC=new Set();SDATE=null;OPEN=null;go('sess',s.id);
  }catch(e){console.error(e);alert('開始訓練失敗，請截圖給我：\n'+(e&&e.message||e));}
}
function liSess(s){const S=sessStats(s);return`<div class="li" onclick="go('sess','${s.id}')"><span class="d">${md(s.date)}<div class=mu style="font-weight:500">週${WK[dow(s.date)]}</div></span><div class="t"><b>${esc(sessTitle(s))}</b>${s.end?'':' <span class="pill" style="background:#2563eb">進行中</span>'}<div>${[...(s.items||[]).filter(it=>(it.sets||[]).some(x=>+x.r)).map(it=>esc(db.ex[it.ex]?.n||'')+' '+it.sets.filter(x=>+x.r).length+'組'),...(S.min?[`🏃 ${S.min} 分${S.km?' '+S.km+' km':''}`]:[])].join('・')}</div></div><span class="v">${S.vol?fmt(S.vol)+' kg':''}<div class=mu>${S.sets?S.sets+' 組':''}</div></span></div>`;}

// ── 訓練中 ──
function vSess(){
  const s=sess(CUR);if(!s){go('home');return;}
  $('ttl').textContent='💪 '+sessTitle(s);
  const groups=[...new Set([...(s.groups||[]),...sessGroups(s)])];
  const S=sessStats(s);
  let h=`<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 12px"><div><b class=mono>${mdd(s.date)}</b> <span class=mu>${wd(s.date)}・${s.start||''}${s.end?'～'+s.end:' 開始'}</span><div class=mu>已記 ${S.sets} 組・${fmt(S.vol)} kg${S.min?`・有氧 ${S.min} 分`:''}</div></div><span style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end"><button class="del" style="color:#475569;padding:4px 8px" onclick="if(OPEN)cleanEx();OPEN=null;go('home')">← 首頁</button><button class="del" style="color:#475569;padding:4px 8px" onclick="editDate()">改日期</button></span></div>`;
  groups.forEach(g=>{
    h+=`<div class="gh2"><i style="background:${GC[g]}"></i>${GN[g]}</div>`;let sub='';
    exList(g).forEach(e=>{if(e.sub&&e.sub!==sub){sub=e.sub;h+=`<div class="sub">${esc(e.sub)}</div>`;}h+=exRow(s,e);});
  });
  const rest=GROUPS_ALL.filter(g=>!groups.includes(g[0]));
  if(rest.length)h+=`<div class="mu" style="margin:14px 0 6px">再加練</div><div class="chips">${rest.map(g=>`<span class="chip" onclick="addG('${g[0]}')">＋ ${g[1]}</span>`).join('')}</div>`;
  h+=`<div class="gh2" style="margin-top:18px">🏃 有氧</div>${(s.cardio||[]).map(c=>`<div class="cd" onclick="go('cardio','${c.id}')"><b>${esc(c.type)}</b><span class=mono style="margin-left:auto">${c.min||'—'} 分・${c.km||'—'} km・${c.kcal||'—'} 大卡</span><span style="color:#94a3b8">›</span></div>`).join('')}
    <div class="chips">${CARDIO.map(t=>`<span class="chip" style="padding:6px 11px;font-size:13px" onclick="addCardio('${t}')">＋ ${t}</span>`).join('')}</div>
    <div class="fld" style="margin-top:14px"><label>備註（今天狀況）</label><textarea rows=2 id="note" placeholder="例如：睡不好、肩膀有點緊">${esc(s.note||'')}</textarea></div>
    <div style="text-align:center;margin-top:10px"><button class="del" onclick="delSess()">🗑 刪除這次訓練</button></div>`;
  $('app').innerHTML=h;
  $('note').onchange=e=>{s.note=e.target.value;touch(s);save();};
  bar(s.end?`<button class="btn gh" onclick="go('home')">← 回首頁</button>`:`<button class="btn dk" onclick="finish()">🏁 今天練完了</button>`);
  if(OPEN){const el=document.querySelector('.ed input.w[data-new="1"]')||document.querySelector('.ed .r-in:placeholder-shown');}
}
function exRow(s,e){
  const it=(s.items||[]).find(x=>x.ex===e.id), done=it&&it.done, ok=it?(it.sets||[]).filter(x=>+x.r):[];
  const vol=ok.reduce((a,x)=>a+setLoad(e,x,s.date)*x.r,0);
  if(OPEN!==e.id)return`<div class="ex${done?' done':''}" onclick="openEx('${e.id}')">${done?'✅':ok.length?'◐':'○'} <b>${esc(e.n)}</b>${e.bw?' <span class=mu>自重</span>':''}<span class="r">${ok.length?`${ok.length} 組・${fmt(vol)} kg`:''}${!ok.length?lastTxt(e.id,s,true):''}</span></div>`;
  const L=lastSets(e.id,s.date,s.id), U=curU(it,e);
  const BWA=e.bw?bwAddOn(it,L):true,BWK=e.bw?bwAt(s.date):0;
  const rows=(it.sets||[]).map((x,i)=>`<div class="st${x.p?' pre':''}${+x.r?' ok':''}"><span class="n">${i+1}</span>
    ${!BWA?`<div class="wbox bwv">自重${BWK?`<span>（體重 ${+(+BWK).toFixed(1)} kg）</span>`:''}</div>`:`<div class="wbox"><button onclick="stepW(${i},-1)">−</button><input class="w" inputmode="decimal" value="${x.w??''}" placeholder="${e.bw?'加重':'kg'}" oninput="setW(${i},this.value)" onfocus="this.select()"><button onclick="stepW(${i},1)">＋</button></div>`}
    <div class="rbox"><input class="r-in" inputmode="numeric" value="${x.r??''}" placeholder="${L&&L.sets[i]?L.sets[i].r:'次'}" oninput="setR(${i},this.value)" onfocus="this.select()"></div>
    ${+x.r?'<span class="ck">✓</span>':`<button class="x" onclick="rmSet(${i})">×</button>`}</div>`).join('');
  return`<div class="ex cur" onclick="openEx(null)">▶ <b>${esc(e.n)}</b><span class="r">收起 ▲</span></div><div class="ed">
    ${L?`<div class="last">上次 ${md(L.date)}（${dayDiff(sess(CUR)?.date||today(),L.date)} 天前）：${L.sets.map(x=>`<b>${wTxt(x,e.bw)}</b>×${x.r}`).join('　')}</div>`:`<div class="last">第一次記這個動作</div>`}
    ${e.bw?`<div class="bwsw"><span class="${BWA?'':'on'}" onclick="bwSet(0)">自重</span><span class="${BWA?'on':''}" onclick="bwSet(1)">＋負重</span></div>`:''}
    <div class="sh"><span>組</span><span style="text-align:center">${BWA?`重量${e.bw?'（額外）':''} `:'重量'}<span class="seg" style="${BWA?'':'display:none'}"><i class="${U==='kg'?'on':''}" onclick="setU('kg')">kg</i><i class="${U==='lb'?'on':''}" onclick="setU('lb')">P</i></span></span><span style="text-align:center">次數</span><span></span></div>${rows}
    ${U==='lb'?`<div class="mu" style="margin:2px 0 4px">P＝磅${(()=>{const x=(it.sets||[]).find(z=>+z.w);return x?`，${x.w}P ≈ ${(x.w*LB).toFixed(1)} kg`:'';})()}（自動換算算訓練量）</div>`:''}${(it.sets||[]).some(x=>x.p)?'<div class="mu" style="margin:2px 0 4px">灰字＝上次這組的重量，一樣就直接填次數</div>':''}
    <div class="row2"><button class="btn gh" onclick="addSet()">＋ 下一組</button><button class="btn ok" style="flex:1.4" onclick="doneEx()">✓ 這個動作結束</button></div></div>`;
}
function lastTxt(exId,s){const L=lastSets(exId,s.date,s.id);return L?`上次 ${md(L.date)} ${wTxt(L.sets[0],db.ex[exId].bw)}${L.sets[0].u==='lb'||db.ex[exId].bw&&!+L.sets[0].w?'':'kg'}`:'';}
function curIt(){const s=sess(CUR);let it=s.items.find(x=>x.ex===OPEN);return[s,it];}
function openEx(id){
  if(OPEN&&OPEN!==id)autoDoneEx();
  OPEN=id;try{localStorage.setItem('ft_open',JSON.stringify({s:CUR,ex:id}));}catch(e){}if(id){const s=sess(CUR);let it=s.items.find(x=>x.ex===id);
    if(!it){it={ex:id,sets:[],done:false};s.items.push(it);}
    if(it.done)it.done=false;
    if(!it.sets.length)it.sets.push(nextSet(s,it,0));}
  render();
  if(id)setTimeout(()=>{const ed=document.querySelector('.ed');if(ed)ed.previousElementSibling.scrollIntoView({behavior:'smooth',block:'start'});const r=[...document.querySelectorAll('.ed .r-in')].find(x=>!x.value);if(r)r.focus();},60);
}
function exU(s,it){if(it.sets[0])return it.sets[0].u||'kg';const L=lastSets(it.ex,s.date,s.id),e=db.ex[it.ex];return(L&&L.sets[0]?L.sets[0].u||'kg':'')||(e&&e.u)||'kg';}
function nextSet(s,it,i){const z=_nextSet(s,it,i),u=exU(s,it);if(u==='lb')z.u='lb';else delete z.u;return z;}
function _nextSet(s,it,i){const L=lastSets(it.ex,s.date,s.id);const eu=exU(s,it);const W=x=>x.w===''||x.w==null?'':((x.u||'kg')===eu?+x.w:Math.round(wKg(x)/(eu==='lb'?LB:1)*2)/2);if(L&&L.sets[i])return{w:W(L.sets[i]),r:'',p:1};const prev=it.sets[it.sets.length-1];if(prev)return{w:prev.w,r:''};if(L&&L.sets.length)return{w:W(L.sets[L.sets.length-1]),r:'',p:1};return{w:'',r:''};}

function vRpM(){$('ttl').textContent='📄 給教練';const T=today(),S=rpStats(RPM),{A}=S,ib=S.ibIn[S.ibIn.length-1]||S.ibBase,has=A.cnt||A.min||absMonth(RPM).length;
  const mon=`<div class="rpm"><button onclick="RPM=rpPrevMonth(RPM);vRpM()">‹</button><b>${RPM.slice(0,4)} 年 ${+RPM.slice(5)} 月</b><button onclick="RPM=rpPrevMonth(RPM,1);vRpM()" ${RPM>=T.slice(0,7)?'disabled':''}>›</button></div>
   <div class="mu" style="text-align:center;margin:-4px 0 10px">${rpDone(RPM)?'✅ 這個月已經給過教練':'每月 1 號左右給教練上個月的'}</div>
   <div class="rps"><span class="${RPSEG==='diag'?'on':''}" onclick="rpSeg('diag')">🩺 重點</span><span class="${RPSEG==='txt'?'on':''}" onclick="rpSeg('txt')">📋 文字清單</span></div>`;
  let body='';
  if(!has)body='<div class="card mu" style="text-align:center;padding:30px 0">這個月還沒有訓練紀錄</div>';
  else if(RPSEG==='txt')body=`<pre class="rptx" id="rptx">${esc(rpText(RPM))}</pre><div class="mu" style="margin-top:6px">按下面「一鍵複製」，或長按文字自己選</div>`;
  else{const F=rpFlags(S);
    body=`<div class="rpk"><div><span class=mu>重訓</span><b>${A.cnt} 次</b></div><div><span class=mu>組數</span><b>${A.sets}</b></div><div><span class=mu>有氧</span><b>${A.min} 分</b></div><div><span class=mu>體脂${ib?' '+md(ib.date):''}</span><b>${ib&&ib.fat!==''&&ib.fat!=null?ib.fat+'%':'—'}</b></div></div>
     <div class="gh2">🩺 教練會看到的重點</div>${F.map(f=>`<div class="rpf ${f[0]}"><b>${f[0]==='r'?'🔴':f[0]==='y'?'🟡':'🟢'} ${f[1]}</b>：${f[2]}</div>`).join('')}
     <div class="gh2" style="margin-top:14px">💪 每週組數 <span class=mu style="font-weight:500">虛線＝10 組</span></div>
     ${GROUPS.map(([k,n,c])=>{const g=S.G[k];return`<div class="rpg"><b style="color:${c}">${n}</b><div class="rpb"><i style="width:${Math.min(100,g.wsets/25*100)}%;background:${c}"></i><u></u></div><span class="mono" style="${g.wsets<6?'color:#dc2626;font-weight:800':''}">${+g.wsets.toFixed(1)}</span></div>`;}).join('')}
     ${absMonth(RPM).length?`<div class="gh2" style="margin-top:14px">🧘 腹肌 本月 ${absMonth(RPM).length} 次</div><div class=mu>${absMonth(RPM).map(d=>md(d)).join('・')}</div>`:''}
     <div class="mu" style="margin-top:8px">完整報告（各動作進步、每次明細、InBody）按「📄 PDF」</div>`;}
  $('app').innerHTML=mon+body;
  bar(`<button class="btn gh" style="flex:0 0 56px" onclick="go('home')">←</button><button class="btn pri" style="flex:2" onclick="rpmCopy()" ${has?'':'disabled'}>📋 一鍵複製</button><button class="btn gh" style="flex:1" onclick="rpmPdf()" ${has?'':'disabled'}>📄 PDF</button>`);}
// ══ 🧘 腹肌卡＋📸 身形照（手機）══
let PHSEG=(()=>{try{return localStorage.getItem('ft_phseg')||'pair';}catch(e){return'pair';}})(),PHA=null,PHB=null,PHX=50;
const _rpmRender1=render;
render=function(){if(V==='photo'){vPhoto();return;}_rpmRender1();if(V==='home'){try{habHome();}catch(e){console.warn(e);}}};
function habHome(){const app=$('app');if(!app)return;app.querySelectorAll('.abc,.phn').forEach(e=>e.remove());const T=SDATE||today(),A=absState(T);
  const dots=[...Array(8)].map((_,i)=>{const d=addDays(T,i-5);return`<i class="${A.dates.includes(d)?'d':''}${d===T?' t':''}">${+d.slice(8)}</i>`;}).join('');
  const card=A.done?`<div class="abc ok"><span style="font-size:22px">🧘</span><div style="flex:1"><b>腹肌 ✓ 今天練了</b><div class=mu>下次 ${md(A.next)}・${esc(absPlan())}・<a class="abp" onclick="absPick()">補記其他天</a></div></div>${(db.abs||[]).some(x=>x.date===T)?`<button class="abu" onclick="absUndo('${T}');render()">取消</button>`:`<button class="abu" onclick="absStart('${T}')">再記</button>`}</div>`
    :`<div class="abc${A.due?'':' rest'}"><span style="font-size:26px">🧘</span><div style="flex:1;min-width:0"><b>${A.due?'腹肌：今天該練了':'腹肌：休息中・再 '+A.left+' 天'}</b><div class=mu>${A.last?`上次 ${md(A.last)}（${A.n} 天前）`:'還沒有紀錄'}・${esc(absPlan())}・<a class="abp" onclick="absPick()">補記</a></div><div class="abd">${dots}</div></div><button class="abb" onclick="absStart('${T}')">✏️ 記錄腹肌</button></div>`;
  const AN=absNagLv(T),hero=app.querySelector('.dsgm');
  if(AN&&AN.strong){const c=`<div class="abc strong"><span style="font-size:26px">🧘</span><div style="flex:1;min-width:0"><b><i class="pls"></i>⚠️ 腹肌已經 ${AN.A.n} 天沒練了</b><div class="sm">上次 ${md(AN.A.last)}（${AN.A.n} 天前）・<a class="abp w" onclick="absPick()">補記其他天</a></div></div><button class="abw" onclick="absStart('${T}')">✏️ 記錄腹肌</button></div>`;if(hero)hero.insertAdjacentHTML('afterend',c);else app.insertAdjacentHTML('afterbegin',c);}
  else{const ao=[...app.querySelectorAll(':scope>.mu')].find(e=>e.textContent.startsWith('有氧')),hint=app.querySelector('.dgr')?.nextElementSibling;if(ao){ao.insertAdjacentHTML('beforebegin',card);const rp=app.querySelector('.rpnag');if(rp)ao.before(rp);}else if(hint)hint.insertAdjacentHTML('afterend',card);else app.insertAdjacentHTML('afterbegin',card);}
  const PN=phNagLv();if(PN)app.insertAdjacentHTML('afterbegin',PN.strong?`<div class="phn strong" onclick="go('photo')"><span style="font-size:24px">📸</span><div><b><i class="pls"></i>${+PN.m.slice(5)} 月身形照還沒拍</b><div class="sm">已經第 ${PN.day} 天了・月初拍最準</div></div><span style="margin-left:auto"><button>拍／上傳</button></span></div>`:`<div class="phn" onclick="go('photo')">📸 <b>${+PN.m.slice(5)} 月的身形照還沒拍</b><span style="margin-left:auto"><button>拍／上傳</button></span></div>`);
  const q=app.querySelector('.q');if(q&&!q.querySelector('.phq'))q.insertAdjacentHTML('beforeend',`<div class="phq" onclick="go('photo')"><span>📸</span>身形照</div>`);}
function phSeg(s){PHSEG=s;try{localStorage.setItem('ft_phseg',s)}catch(e){}vPhoto();}
function phMonths(){const L=[],t=today().slice(0,7);let d=new Date(t+'-01T00:00:00Z');for(let i=0;i<13;i++){L.push(d.toISOString().slice(0,7));d.setUTCMonth(d.getUTCMonth()-1);}return L;}
const mLab=m=>(m.slice(0,4)!==today().slice(0,4)?m.slice(2,4)+'/':'')+(+m.slice(5))+' 月';
async function phPick(inp){const f=inp.files&&inp.files[0];if(!f)return;const m=$('phm')?.value||today().slice(0,7);
  if(phOf(m)&&!confirm(mLab(m)+'已經有照片了，要換成這張嗎？')){inp.value='';return;}
  toast('📸 上傳中…');try{await phUpload(f,m);PHB=m;toast('✅ '+mLab(m)+'的照片存好了（已加密）');}catch(e){alert(e.message||e);}inp.value='';vPhoto();}
function phImg(p,cls,st,z){return p?`<img class="${cls||''}" data-ph="${p.id}" style="${st||''}" alt=""${z?` onclick="event.stopPropagation();phZoom('${p.id}')"`:''}>`:`<div class="phe" style="${st||''}">沒有照片</div>`;}
function phIbTxt(m){const x=phIb(m);return x?`${x.wt||'—'}kg・體脂 ${x.fat!==''&&x.fat!=null?x.fat+'%':'—'}`:'—';}
function vPhoto(){$('ttl').textContent='📸 身形照';const L=phList(),Ms=L.map(p=>p.month);
  if(!PHB||!Ms.includes(PHB))PHB=Ms[Ms.length-1]||null;
  if(!PHA||!Ms.includes(PHA)||PHA>=PHB){const want=PHB?(()=>{const d=new Date(PHB+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()-3);return d.toISOString().slice(0,7);})():null;PHA=Ms.filter(m=>m<PHB&&m<=want).pop()||Ms.find(m=>m<PHB)||null;}
  const sel=`<select id="phm" class="phs">${phMonths().map(m=>`<option value="${m}">${mLab(m)}${phOf(m)?'（已有，換一張）':m===today().slice(0,7)?'（這個月）':'（補拍）'}</option>`).join('')}</select>`;
  const up=`<div class="card" style="padding:10px 12px"><div class=mu style="margin-bottom:6px">上傳／補照片：選月份 → 拍照或選相簿（正面一張；同一月份再傳會換掉）</div><div style="display:flex;gap:8px">${sel}<label class="phb">📸 選照片<input type="file" accept="image/*" style="display:none" onchange="phPick(this)"></label></div></div>`;
  let body='';
  if(!L.length)body=`<div class="card mu" style="text-align:center;padding:30px 12px;line-height:1.8">還沒有身形照<br>每月初拍一張正面，<b>同樣地點、燈光、時間</b>（早上空腹最好），才好比較</div>`;
  else{const pick=(v,name)=>`<div class="phc">${Ms.map(m=>`<span class="${v===m?'on':''}" onclick="${name}='${m}';vPhoto()">${mLab(m)}</span>`).join('')}</div>`;
    const pa=L.find(p=>p.month===PHA),pb=L.find(p=>p.month===PHB);
    if(PHSEG==='grid')body=`<div class="phg">${L.slice().reverse().map(p=>`<div>${phImg(p,'pht','',1)}<b>${mLab(p.month)}</b><span class=mu>${phIbTxt(p.month)}</span></div>`).join('')}</div><div class=mu style="text-align:center;margin-top:6px">點照片放大</div>`;
    else if(PHSEG==='slide')body=pa&&pb?`<div class="phsl">${phImg(pa,'phi')}${phImg(pb,'phi',`clip-path:inset(0 0 0 ${PHX}%)`)}<div class="phln" style="left:${PHX}%"></div><span class="phtg l">${mLab(PHA)}</span><span class="phtg r">${mLab(PHB)}</span>
      <input type="range" min="0" max="100" value="${PHX}" oninput="PHX=+this.value;const s=this.parentNode;s.querySelectorAll('img')[1].style.clipPath='inset(0 0 0 '+PHX+'%)';s.querySelector('.phln').style.left=PHX+'%'"></div><div class=mu style="text-align:center;margin:4px 0 8px">左右拖，看哪裡變了・要看細節到「並排比較」點照片放大</div><div class=mu>舊的</div>${pick(PHA,'PHA')}<div class=mu>新的</div>${pick(PHB,'PHB')}`:'<div class="card mu">要兩個月以上的照片才能用滑桿</div>';
    else body=`<div style="display:flex;gap:6px">${[[PHA,pa],[PHB,pb]].map(([m,p])=>`<div style="flex:1;min-width:0;text-align:center"><b style="font-size:13px">${m?mLab(m):'—'}</b>${phImg(p,'phi2','',1)}<div class="mu mono" style="font-size:11px">${m?phIbTxt(m):''}</div></div>`).join('')}</div>
      <div class=mu style="margin-top:8px">左邊（舊）</div>${pick(PHA,'PHA')}<div class=mu>右邊（新）</div>${pick(PHB,'PHB')}`;}
  $('app').innerHTML=`<div class="rps"><span class="${PHSEG==='pair'?'on':''}" onclick="phSeg('pair')">並排比較</span><span class="${PHSEG==='grid'?'on':''}" onclick="phSeg('grid')">每月格子</span><span class="${PHSEG==='slide'?'on':''}" onclick="phSeg('slide')">滑桿</span></div>${body}<div style="margin-top:10px">${up}</div><div class=mu style="line-height:1.6">🔒 照片用資料密碼加密後才上傳，別人打不開；教練報告不會放照片。</div>`;
  bar(`<button class="btn gh" style="flex:1" onclick="go('home')">← 首頁</button>`);
  document.querySelectorAll('#app img[data-ph]').forEach(async im=>{const p=L.find(x=>x.id===im.dataset.ph);try{const u=await phUrl(p);if(u)im.src=u;else im.replaceWith(Object.assign(document.createElement('div'),{className:'phe',textContent:'讀不到（要資料密碼）'}));}catch(e){}});}

// ── 啟動 ──
(async function(){
  const m=location.hash.match(/s=([\w]+)/);if(location.hash==='#new'){}
  if(m&&sess(m[1])){CUR=m[1];V='sess';}
  else if(!EMBED){// 休息時被系統關掉也沒關係：打開直接回到進行中的訓練和剛剛那個動作
    const o=openSess();if(o){CUR=o.id;V='sess';try{const j=JSON.parse(localStorage.getItem('ft_open')||'null');if(j&&j.s===o.id&&o.items.some(it=>it.ex===j.ex&&!it.done))OPEN=j.ex;}catch(e){}}}
  render();if(OPEN)setTimeout(()=>{const ed=document.querySelector('.ed');if(ed)ed.previousElementSibling.scrollIntoView({block:'start'});},80);
  const ch=await pull();if(ch){if(V==='sess'&&!sess(CUR))V='home';render();}
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&!OPEN){if(await pull())render();}});
})();
</script>
</body>
</html>
