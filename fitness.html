if((window.innerWidth<768||(Math.min(screen.width,screen.height)<768&&navigator.maxTouchPoints>0))&&!location.search.includes('force=pc'))location.href='fitness-m.html';
// ══ 🔐 資料密碼＋資料加密（2026/10）══
//   1) 呼叫雲端同步服務時自動帶通行碼（X-Sync-Key）；查股價、大盤不用帶
//   2) 四個資料檔上傳前自動加密（AES-256-GCM）、下載後自動解開；各頁面原本的同步程式完全不用改
//   3) 這台沒有鑰匙卻讀到加密檔 → 不交出資料、也不准上傳（避免拿舊資料蓋掉雲端），跳出輸入密碼
(function(){
  const W='https://dashboard-sync.manny76528.workers.dev', KS='syncKey_v1', KE='encKey_v1', KON='encOn_v1';
  const ENC_FILES=['data_dashboard.json','data_inventory.json','data_glove.json','data_vocab.json','data_fitness.json'];
  const SALT='stock-dashboard/manny76528-star/data-v1', ITER=600000;
  const ls={get:k=>{try{return localStorage.getItem(k)||'';}catch(e){return'';}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k);}catch(e){}}};
  const te=new TextEncoder(), td=new TextDecoder();
  async function hex(s){const b=await crypto.subtle.digest('SHA-256',typeof s==='string'?te.encode(s):s);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  const h2b=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
  const b2b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
  const b642b=b=>{const s=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
  window.syncKeyFromPw=pw=>hex('sync:'+pw);
  window.syncHashFromKey=k=>hex(k);
  window.syncGetKey=()=>ls.get(KS); window.syncSetKey=k=>ls.set(KS,k);
  window.encGetKey=()=>ls.get(KE); window.encSetKey=k=>ls.set(KE,k);
  window.encIsOn=()=>ls.get(KON)==='1'; window.encSetOn=v=>ls.set(KON,v?'1':'');
  window.encKeyFromPw=async pw=>{const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode(SALT),iterations:ITER,hash:'SHA-256'},base,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');};
  window.encKid=async k=>(await hex(h2b(k))).slice(0,8);
  const isEnv=o=>o&&typeof o==='object'&&o.enc==='v1'&&o.ct&&o.iv;
  window.encIsEnvelopeText=t=>{try{return isEnv(JSON.parse(t));}catch(e){return false;}};
  async function aes(k){return crypto.subtle.importKey('raw',h2b(k),'AES-GCM',false,['encrypt','decrypt']);}
  window.encSeal=async(plainBytes,k)=>{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aes(k),plainBytes));
    return JSON.stringify({enc:'v1',alg:'AES-256-GCM',kdf:'PBKDF2-SHA256-'+ITER,kid:await encKid(k),ts:Date.now(),iv:b2b64(iv),ct:b2b64(ct)});};
  window.encOpen=async(env,k)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b642b(env.iv)},await aes(k),b642b(env.ct)));
  const pub=u=>/^\/(price|index)(\?|$)/.test(u.slice(W.length));
  const fileOf=u=>decodeURIComponent(u.slice(W.length+1).split('?')[0]);
  const _f=window.fetch.bind(window);window._syncRawFetch=_f;
  const fail=(st,msg)=>new Response(JSON.stringify({error:msg,message:msg}),{status:st,headers:{'Content-Type':'application/json'}});
  window.fetch=async function(input,init){
    const url=typeof input==='string'?input:(input&&input.url)||'';
    if(!url.startsWith(W)||pub(url))return _f(input,init);
    const k=window.syncGetKey();
    init=Object.assign({},init||{});
    if(k){const h=new Headers(init.headers||(typeof input!=='string'&&input.headers)||{});h.set('X-Sync-Key',k);init.headers=h;}
    const file=fileOf(url), method=String(init.method||(typeof input!=='string'&&input.method)||'GET').toUpperCase(), enc=ENC_FILES.includes(file);
    if(enc&&method==='PUT'){
      try{const body=JSON.parse(init.body);const ek=window.encGetKey();
        if(ek&&window.encIsOn()){body.content=b2b64(te.encode(await encSeal(b642b(body.content),ek)));init.body=JSON.stringify(body);}
        else{ // 這台沒開加密：先看雲端是不是已經加密了，是的話不准用明文蓋掉
          const r0=await _f(W+'/'+file+'?t='+Date.now(),{headers:init.headers});
          if(r0.ok){const j0=await r0.json();if(j0&&j0.content&&isEnv(JSON.parse(td.decode(b642b(j0.content))))){setTimeout(()=>window.syncAsk('enc'),0);return fail(423,'encrypted: need key');}}}
      }catch(e){console.warn('[加密] 上傳前處理失敗',e);return fail(500,'encrypt failed');}
    }
    const r=await _f(input,init);
    if(r.status===401){setTimeout(()=>window.syncAsk(k?'wrong':'first'),0);return r;}
    if(enc&&method==='GET'&&r.ok){
      let j;try{j=await r.clone().json();}catch(e){return r;}
      if(!j||!j.content)return r;
      let env=null;try{const o=JSON.parse(td.decode(b642b(j.content)));if(isEnv(o))env=o;}catch(e){}
      if(!env)return r;
      window.encSetOn(true);
      const ek=window.encGetKey();
      if(!ek){setTimeout(()=>window.syncAsk('enc'),0);return fail(423,'encrypted: need key');}
      if(env.kid&&env.kid!==await encKid(ek)){setTimeout(()=>window.syncAsk('enckey'),0);return fail(423,'encrypted: wrong key');}
      try{const plain=await encOpen(env,ek);j.content=b2b64(plain);return new Response(JSON.stringify(j),{status:200,headers:{'Content-Type':'application/json'}});}
      catch(e){setTimeout(()=>window.syncAsk('enckey'),0);return fail(423,'decrypt failed');}
    }
    return r;
  };
  let shown=false;
  const MSG={first:['這台裝置第一次同步','輸入「資料密碼」才能讀寫雲端資料',''],wrong:['資料密碼不對或已更換','輸入「資料密碼」才能讀寫雲端資料','⚠️ 雲端拒絕了這台裝置記住的密碼，請重新輸入'],
    enc:['雲端資料已加密','輸入「資料密碼」解開這台的資料',''],enckey:['資料密碼不對或已更換','雲端資料用另一組密碼加密','⚠️ 這台記住的鑰匙解不開，請重新輸入資料密碼']};
  window.syncAsk=function(why){
    if(shown||document.getElementById('sa-bg'))return;shown=true;const M=MSG[why]||MSG.first;
    const go=()=>{const bg=document.createElement('div');bg.id='sa-bg';
      bg.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif';
      bg.innerHTML=`<div style="background:#fff;border-radius:18px;width:min(380px,100%);box-shadow:0 30px 70px rgba(0,0,0,.3);overflow:hidden">
        <div style="text-align:center;padding:22px 18px 8px;background:linear-gradient(135deg,#eff6ff,#f5f3ff)"><div style="font-size:38px">🔐</div><b style="font-size:17px;color:#0f172a">${M[0]}</b><div style="font-size:12.5px;color:#64748b;margin-top:4px">${M[1]}</div></div>
        <div style="padding:14px 18px 18px"><div style="display:flex;align-items:center;border:1.5px solid #93c5fd;border-radius:11px;padding:0 10px;box-shadow:0 0 0 3px #dbeafe"><input id="sa-pw" type="password" autocomplete="current-password" style="flex:1;border:none;outline:none;padding:11px 0;font-size:16px;background:transparent;min-width:0" placeholder="資料密碼"><span id="sa-eye" style="cursor:pointer;font-size:16px">👁</span></div>
        ${M[2]?`<div style="color:#dc2626;font-size:12.5px;margin-top:6px">${M[2]}</div>`:''}
        <div id="sa-st" style="font-size:12px;color:#64748b;margin-top:8px">輸入一次就會記在這台裝置，之後不會再問。</div>
        <div style="display:flex;gap:8px;margin-top:14px"><button id="sa-no" style="flex:1;padding:10px;border:1px solid #e2e8f0;border-radius:11px;background:#fff;color:#64748b;font-weight:700;font-size:14px;cursor:pointer">先不要</button><button id="sa-ok" style="flex:2;padding:10px;border:none;border-radius:11px;background:#2563eb;color:#fff;font-weight:800;font-size:14px;cursor:pointer">解開並同步</button></div></div></div>`;
      document.body.appendChild(bg);const pw=bg.querySelector('#sa-pw');setTimeout(()=>pw.focus(),50);
      bg.querySelector('#sa-eye').onclick=()=>{pw.type=pw.type==='password'?'text':'password';};
      bg.querySelector('#sa-no').onclick=()=>{bg.remove();};
      const ok=async()=>{if(!pw.value)return;const st=bg.querySelector('#sa-st');st.textContent='🔑 產生鑰匙中（第一次約 1–3 秒）…';
        window.syncSetKey(await window.syncKeyFromPw(pw.value));window.encSetKey(await window.encKeyFromPw(pw.value));location.reload();};
      bg.querySelector('#sa-ok').onclick=ok;pw.onkeydown=e=>{if(e.key==='Enter')ok();};};
    if(document.body)go();else document.addEventListener('DOMContentLoaded',go);
  };
})();

const b64e=s=>{const u=new TextEncoder().encode(s);let r='';for(let i=0;i<u.length;i+=0x8000)r+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(r);};
const b64d=b=>{const s=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u);};
function syncMsg(t){const e=document.getElementById('sync');if(e)e.textContent=t;}
async function pull(){
  if(_pulling)return false;_pulling=true;
  try{const r=await fetch(FT_API+'?t='+Date.now());
    if(r.status===404){_sha='';syncMsg('☁️ 雲端還沒有資料');return false;}
    if(!r.ok){syncMsg('⚠️ 同步失敗');return false;}
    const j=await r.json();_sha=j.sha;const remote=JSON.parse(b64d(j.content));
    const before=JSON.stringify(db.sessions)+JSON.stringify(db.inbody)+JSON.stringify(db.ex)+JSON.stringify(db.abs)+JSON.stringify(db.photos);
    db=mergeDb(db,remote);try{localStorage.setItem(FT_KEY,JSON.stringify(db));}catch(e){}
    syncMsg('✅ 已同步');return before!==JSON.stringify(db.sessions)+JSON.stringify(db.inbody)+JSON.stringify(db.ex)+JSON.stringify(db.abs)+JSON.stringify(db.photos);
  }catch(e){console.warn('pull',e);syncMsg('⚠️ 離線（存在這台）');return false;}finally{_pulling=false;}}
function schedulePush(){clearTimeout(_pushT);syncMsg('⏳ 等待同步…');_pushT=setTimeout(push,1500);}
async function push(n=0){
  // 資料庫是公開的：沒有加密鑰匙就絕不上傳（只存在這台）
  if(!(window.encGetKey&&window.encGetKey())){syncMsg('🔐 輸入資料密碼後才會同步');if(window.syncAsk)window.syncAsk('enc');return;}
  if(window.encSetOn)window.encSetOn(true);
  try{
    // 先拿雲端最新的合併，避免兩台裝置互蓋
    const g=await fetch(FT_API+'?t='+Date.now());
    if(g.ok){const j=await g.json();_sha=j.sha;db=mergeDb(db,JSON.parse(b64d(j.content)));}
    else if(g.status!==404){syncMsg('⚠️ 同步失敗（存在這台）');return;}
    else _sha='';
    db._ts=Date.now();try{localStorage.setItem(FT_KEY,JSON.stringify(db));}catch(e){}
    const body={message:'fitness-sync:'+Date.now(),content:b64e(JSON.stringify(db))};if(_sha)body.sha=_sha;
    const r=await fetch(FT_API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){if(n<4){await new Promise(s=>setTimeout(s,600*(n+1)));return push(n+1);}}
    if(!r.ok){syncMsg('⚠️ 同步失敗（存在這台）');return;}
    const j=await r.json();_sha=j.content&&j.content.sha;syncMsg('✅ 已同步至雲端');
  }catch(e){console.warn('push',e);syncMsg('⚠️ 離線（存在這台，連線後再同步）');}}

// ── 計算 ──
function bwAt(d){const L=db.inbody.filter(x=>x.date<=d&&x.wt).sort((a,b)=>a.date.localeCompare(b.date));return L.length?+L[L.length-1].wt:(db.inbody.find(x=>x.wt)?.wt||0);}
const LB=0.45359237;
function wKg(s){return (+s.w||0)*(s.u==='lb'?LB:1);}
function wTxt(s,bw){if(s.w===''||s.w==null)return'?';const w=+s.w||0;if(bw&&!w)return'自重';return w+(s.u==='lb'?'P':'');}
function setTxt(s,bw){return wTxt(s,bw)+'×'+s.r;}
function setLoad(e,s,date){return (e&&e.bw?bwAt(date)+wKg(s):wKg(s));}
function e1rm(w,r){r=+r||0;w=+w||0;if(!w||!r)return 0;return r===1?w:w*(1+Math.min(r,15)/30);}
function sessStats(s){let vol=0,sets=0;const byG={};(s.items||[]).forEach(it=>{const e=db.ex[it.ex];(it.sets||[]).forEach(st=>{if(!(+st.r))return;sets++;const v=setLoad(e,st,s.date)*(+st.r);vol+=v;const g=e?e.g:'?';(byG[g]=byG[g]||{sets:0,vol:0}).sets++;byG[g].vol+=v;});});
  const c=(s.cardio||[]).reduce((a,x)=>({min:a.min+(+x.min||0),km:a.km+(+x.km||0),kcal:a.kcal+(+x.kcal||0)}),{min:0,km:0,kcal:0});return{vol,sets,byG,...c};}
// 只算真的有做組的部位（開始時多勾、或開了沒練的那場，都不算進月曆／統計）
function sessGroups(s){const act=new Set();(s.items||[]).forEach(it=>{const e=db.ex[it.ex];if(e&&(it.sets||[]).some(x=>+x.r))act.add(e.g);});const g=act;return GROUPS.map(x=>x[0]).filter(k=>g.has(k));}
function sessTitle(s){let g=sessGroups(s);if(!g.length&&!s.end)g=GROUPS.map(x=>x[0]).filter(k=>(s.groups||[]).includes(k));const p=PRESETS.find(p=>p[1].length===g.length&&p[1].every(x=>g.includes(x)));let t=p?p[0]:g.map(k=>GN[k]).join('＋');if((s.items||[]).some(it=>db.ex[it.ex]?.g==='abs'&&(it.sets||[]).some(x=>+x.r))||(!s.end&&(s.groups||[]).includes('abs')&&!sessGroups(s).length))t=t?t+'＋腹肌':'腹肌';if(!t&&(s.cardio||[]).length)t='有氧';else if((s.cardio||[]).length)t+='＋有氧';return t||'訓練';}
// 某動作上一次（在 beforeDate 之前、或同一天但不同場）的組
function lastSets(exId,beforeDate,exceptId){const L=db.sessions.filter(s=>s.id!==exceptId&&s.date<=beforeDate&&(s.items||[]).some(it=>it.ex===exId&&(it.sets||[]).some(x=>+x.r))).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));
  if(!L.length)return null;const s=L[L.length-1];return{date:s.date,sets:s.items.find(it=>it.ex===exId).sets.filter(x=>+x.r)};}
function lastGroup(g,beforeDate,exceptId){const L=db.sessions.filter(s=>s.id!==exceptId&&s.date<=beforeDate&&sessGroups(s).includes(g)).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));return L.length?L[L.length-1]:null;}
// 每個動作的歷史最佳（估算 1RM、最重）
function exHistory(exId){const e=db.ex[exId];return db.sessions.filter(s=>(s.items||[]).some(it=>it.ex===exId)).map(s=>{const st=s.items.find(it=>it.ex===exId).sets.filter(x=>+x.r);
  let best=0,top=0,vol=0;st.forEach(x=>{const L=setLoad(e,x,s.date);best=Math.max(best,e1rm(L,x.r));top=Math.max(top,wKg(x));vol+=L*(+x.r);});return{date:s.date,id:s.id,best,top,vol,sets:st};}).filter(x=>x.sets.length).sort((a,b)=>a.date.localeCompare(b.date));}
function prsIn(from,to){const out=[];Object.keys(db.ex).forEach(id=>{const H=exHistory(id);let mx=0;H.forEach(h=>{if(h.best>mx+0.01){if(mx>0&&h.date>=from&&h.date<=to)out.push({ex:id,date:h.date,best:h.best,prev:mx,top:h.top});mx=h.best;}});});return out;}

const EX_ALIAS={'平板臥推':'槓鈴臥推','槓鈴平板臥推':'槓鈴臥推','臥推':'槓鈴臥推','機器上胸':'上胸臥推','上胸':'上胸臥推','下胸':'雙槓下胸','夾胸':'機器夾胸','腿後勾':'股二頭機器','機械腿後勾':'股二頭機器','機器腿後勾':'股二頭機器','腿部伸展':'股四頭坐姿腿部伸展','機械肩推':'肩推','機器肩推':'肩推','啞鈴肩推':'肩推','啞鈴側平舉':'側平舉','啞鈴前平舉':'前平舉','握推':'臥推'};
function _exNorm(n){return String(n).replace(/\s/g,'').replace(/握推/g,'臥推').replace(/灣舉/g,'彎舉').replace(/[vV]行/g,'V型').replace(/V 型/g,'V型');}

  const raw=_exNorm(name), all=Object.entries(db.ex);
  const by=n=>all.find(([id,e])=>_exNorm(e.n)===_exNorm(n));
  let hit=by(raw)||(EX_ALIAS[raw]&&by(EX_ALIAS[raw]));if(hit)return hit[0];
  const strip=s=>_exNorm(s).replace(/^(槓鈴|啞鈴|機器|機械|器械|纜繩|滑輪)/,'').replace(/^平板/,'');
  hit=all.find(([id,e])=>strip(e.n)===strip(raw))||(EX_ALIAS[strip(raw)]&&by(EX_ALIAS[strip(raw)]))||all.find(([id,e])=>strip(e.n).includes(strip(raw))||strip(raw).includes(strip(e.n)));

function parseImport(text){
  const out=[],warn=[];let cur=null;const GMAP={'胸':'chest','背':'back','腿':'legs','肩':'shoulder','二頭':'bi','三頭':'tri','手臂':null};
  String(text).split(/\n|。/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    if(/^【[^】]*】$/.test(line)||/^🏋️|^共 \d+ 次|^🧘/.test(line))return; // 複製出來的清單：肌群標題、表頭略過
    const d=line.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\s*(?:[（(]([^）)]*)[）)])?/);
    if(d){cur={date:`${d[1]}-${String(d[2]).padStart(2,'0')}-${String(d[3]).padStart(2,'0')}`,label:d[4]||'',groups:[],items:[],cardio:[]};
      (d[4]||'').split(/[＋+、,，\/]/).forEach(g=>{g=g.trim();if(GMAP[g])cur.groups.push(GMAP[g]);});out.push(cur);return;}
    const m=line.match(/^(.+?)[：:]\s*(.+)$/);if(!m||!cur){warn.push('看不懂：'+line);return;}
    // 有氧：「跑步機：25分、1.5公里、206kcal」
    const ct=CARDIO.find(c=>m[1].replace(/\s/g,'').includes(c))||(/有氧|走路|快走|跑步|單車|腳踏車/.test(m[1])?m[1].trim():null);

      if(c.min===''&&c.km===''&&c.kcal===''){warn.push(`${cur.date} ${m[1]} 看不懂：${v}（例：25分、1.5公里、206kcal）`);return;}cur.cardio.push(c);return;}

    if(sets.some(s=>!s)){warn.push(`${cur.date} ${m[1]} 有看不懂的組：${m[2]}`);}
    const ok=sets.filter(Boolean);if(!ok.length)return;if(db.ex[id].bw)ok.forEach(x=>{if(x.w==='')x.w=0;});

function importKey(s){return s.date+'|'+(s.cardio||[]).map(c=>c.type+c.min+'/'+c.km+'/'+c.kcal).join(',')+'|'+s.items.map(it=>it.ex+':'+it.sets.map(x=>(x.w===''?'':x.w)+(x.u==='lb'?'P':'')+'x'+x.r).join(',')).join(';');}

const TRAIN_DOW=[1,2,3,4,5],DUE_REC={chest:4,back:4,legs:4,shoulder:4,bi:4,tri:4,abs:4},DUE_W=8,DUE_R=8; // 💤 0～3 天恢復中、✓ 4～7 天可以練、⚠️ 8 天以上太久

function groupDue(g,T){T=T||today();const D=g==='abs'?absDates().filter(d=>d<=T):[...new Set(db.sessions.filter(s=>s.date<=T&&sessGroups(s).includes(g)).map(s=>s.date))].sort();
  const name=(GROUPS_ALL.find(x=>x[0]===g)||[])[1],rec=DUE_REC[g]||2;
  if(!D.length)return{g,name,n:null,rank:4,cls:'r',dates:[],anchor:null,last:null,wk:0,rec};

  let main=L.filter(x=>SG_BIG.includes(x.g)).sort((a,b)=>key(b)-key(a))[0];const small=L.filter(x=>!SG_BIG.includes(x.g)).sort((a,b)=>key(b)-key(a))[0];

function rpStats(m){

      EX.push({id,ex,reps:1,n:H.length,first:F0,last:L0,d:H.length>=2?L0-F0:null,top:null,avgR:all.reduce((x,y)=>x+(+y.r),0)/all.length,maxR:Math.max(...all.map(x=>+x.r)),noW:0,nSets:all.length,jump});return;}
    EX.push({id,ex,n:H.length,first:f?f.best:0,last:l?l.best:0,d,top,avgR:all.reduce((x,y)=>x+(+y.r),0)/all.length,maxR:Math.max(...all.map(x=>+x.r)),noW,nSets:all.length,jump});});

function rpFlags(S){const F=[],G=S.G,gn=k=>`<b style="color:${GC[k]}">${GN[k]}</b>`;

function spark(a,c,w=96,h=22){const v=a.filter(x=>x>0);if(v.length<2)return`<svg width="${w}" height="${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#e2e8f0" stroke-dasharray="3 3"/></svg>`;const mx=Math.max(...v),mn=Math.min(...v);
  return`<svg width="${w}" height="${h}"><polyline points="${v.map((y,i)=>`${(i*(w-4)/(v.length-1)+2).toFixed(1)},${(h-3-(y-mn)/((mx-mn)||1)*(h-6)).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2"/><circle cx="${w-2}" cy="${(h-3-(v[v.length-1]-mn)/((mx-mn)||1)*(h-6)).toFixed(1)}" r="2.6" fill="${c}"/></svg>`;}
function exRowInfo(id){const H=exHistory(id),T=today();const R=H.filter(h=>h.date>=addDays(T,-56));const base=R.length?R[0]:null,last=H[H.length-1];

function exDetail(id){const cur=db.ex[id],H=exHistory(id);if(!H.length)return'<div class="empty" style="padding:16px 0">這個動作還沒有紀錄</div>';

function drawExChart(id){const H=exHistory(id);if(!H.length||!$('exc'))return;let mx=0;const pr=H.map(h=>{const p=h.best>mx+0.01;if(p)mx=h.best;return p;});
  // 股票感：比上次進步＝紅、退步＝綠、持平＝灰；點旁標漲跌；虛線＝第一次的起點，高於起點底色淡紅、低於淡綠
  const V=H.map(h=>+h.best.toFixed(1)),UP='#dc2626',DN='#16a34a',FL='#94a3b8',cl=i=>!i?'#64748b':V[i]>V[i-1]+.01?UP:V[i]<V[i-1]-.01?DN:FL;
  const lbl={id:'exlbl',afterDatasetsDraw(ch){const m=ch.getDatasetMeta(0),x=ch.ctx;if(m.hidden)return;x.save();x.font='bold 11px ui-monospace,monospace';x.textAlign='center';
    m.data.forEach((p,i)=>{if(!i)return;const c=+(V[i]-V[i-1]).toFixed(1);if(Math.abs(c)<.05)return;x.fillStyle=c>0?UP:DN;x.fillText((c>0?'+':'')+c.toFixed(1),p.x,c>0?p.y-12:p.y+19);});x.restore();}};
  CH.ex=new Chart($('exc'),{plugins:[lbl],data:{labels:H.map(h=>md(h.date)),datasets:[
    {type:'line',label:'估算 1RM',data:V,borderColor:UP,backgroundColor:UP,segment:{borderColor:c=>{const a=c.p0.parsed.y,b=c.p1.parsed.y;return b>a+.01?UP:b<a-.01?DN:FL;}},
     pointBackgroundColor:V.map((v,i)=>cl(i)),pointBorderColor:V.map((v,i)=>cl(i)),pointRadius:H.map((h,i)=>pr[i]?7:4),pointStyle:H.map((h,i)=>pr[i]?'star':'circle'),borderWidth:3,tension:.25,yAxisID:'y',
     fill:H.length>1?{target:{value:V[0]},above:'rgba(220,38,38,.08)',below:'rgba(22,163,74,.10)'}:false},
    {type:'line',label:'最重一組',data:H.map(h=>+h.top.toFixed(1)),borderColor:'#cbd5e1',borderDash:[5,4],borderWidth:1.5,pointRadius:2,yAxisID:'y'},
    ...(H.length>1?[{type:'line',label:'起點',data:V.map(()=>V[0]),borderColor:'#94a3b8',borderDash:[2,4],borderWidth:1,pointRadius:0,yAxisID:'y',trend:1}]:[]),
    {type:'bar',label:'訓練量',data:H.map(h=>Math.round(h.vol)),backgroundColor:'#2563eb22',borderRadius:5,yAxisID:'y2'}]},
   options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11.5}}},tooltip:{filter:i=>!i.dataset.trend,callbacks:{afterLabel:c=>c.datasetIndex===0&&c.dataIndex?(()=>{const d=+(V[c.dataIndex]-V[c.dataIndex-1]).toFixed(1);return Math.abs(d)<.05?'比上次 持平':'比上次 '+(d>0?'▲ +':'▼ ')+d.toFixed(1)+' kg';})():''}}},
    scales:{x:{grid:{display:false}},y:{title:{display:true,text:'kg'},grid:{color:'#f1f5f9'},grace:'8%'},y2:{position:'right',grid:{display:false},title:{display:true,text:'訓練量 kg'},beginAtZero:true}}}});}

render=function(){if(TAB==='ph'){tabs();Object.values(CH).forEach(c=>c.destroy());CH={};vPhW();return;}_phRender0();};
const wmLab=m=>m.slice(0,4)+'/'+(+m.slice(5))+' 月';
function wphIb(m){const x=phIb(m);return x?`${x.wt||'—'} kg・體脂 ${x.fat!==''&&x.fat!=null?x.fat+'%':'—'}・肌肉 ${x.mm||'—'}`:'（沒有 InBody）';}
async function wphPick(inp){const f=inp.files&&inp.files[0];if(!f)return;const m=document.getElementById('wphm').value;if(phOf(m)&&!confirm(wmLab(m)+' 已經有照片了，要換成這張嗎？')){inp.value='';return;}
  try{rpToast('📸 上傳中…');await phUpload(f,m);WPB=m;rpToast('✅ '+wmLab(m)+' 的照片存好了（已加密）');}catch(e){alert(e.message||e);}inp.value='';vPhW();}
function vPhW(){const L=phList(),Ms=L.map(p=>p.month);
  if(!WPB||!Ms.includes(WPB))WPB=Ms[Ms.length-1]||null;
  if(!WPA||!Ms.includes(WPA)||WPA>=WPB){const w=WPB?rpPrevMonth(WPB,-3):null;WPA=Ms.filter(m=>m<WPB&&m<=w).pop()||Ms.find(m=>m<WPB)||null;}
  const img=(p,st)=>p?`<img data-ph="${p.id}" style="${st||''}" onclick="phZoom('${p.id}')" alt="">`:'<div class="wphe">沒有照片</div>';
  const pick=(v,n)=>Ms.map(m=>`<span class="wpc${v===m?' on':''}" onclick="${n}='${m}';vPhW()">${wmLab(m)}</span>`).join('');
  const months=[];{let m=today().slice(0,7);for(let i=0;i<13;i++){months.push(m);m=rpPrevMonth(m);}}
  const pa=L.find(p=>p.month===WPA),pb=L.find(p=>p.month===WPB);
  $('app').innerHTML=`<div class="card"><div class="ct">📸 身形照<span class=mu>每月初拍一張正面；同樣地點、燈光、時間（早上空腹）最好比較・點照片放大</span>
     <span style="margin-left:auto;display:flex;gap:8px;align-items:center"><select id="wphm" class="wps">${months.map(m=>`<option value="${m}">${wmLab(m)}${phOf(m)?'（已有，換一張）':m===today().slice(0,7)?'（這個月）':'（補拍）'}</option>`).join('')}</select><label class="tb pri" style="cursor:pointer">📸 上傳／補照片<input type="file" accept="image/*" style="display:none" onchange="wphPick(this)"></label></span></div>
   ${!L.length?'<div class="empty">還沒有身形照（手機版首頁或這裡都可以上傳）</div>':`
   <div class="wpg">${L.slice().reverse().map(p=>`<div class="wpi${p.month===WPA||p.month===WPB?' sel':''}">${img(p)}<b>${wmLab(p.month)}</b><span class=mu>${wphIb(p.month)}</span></div>`).join('')}</div></div>
   ${L.length>1?`<div class="wpcmp"><div class="card"><div class="ct">↔ 並排比較<span class=mu>點照片放大看細節</span></div>
      <div class="wp2">${[[WPA,pa],[WPB,pb]].map(([m,p])=>`<div><b>${m?wmLab(m):'—'}</b>${img(p)}<div class="mu mono">${m?wphIb(m):''}</div></div>`).join('')}</div>
      <div class="mu" style="margin-top:8px">左邊（舊）${pick(WPA,'WPA')}</div><div class="mu" style="margin-top:4px">右邊（新）${pick(WPB,'WPB')}</div></div>
     <div class="card"><div class="ct">⇆ 滑桿<span class=mu>左右拖，看哪裡變了</span></div>
      ${pa&&pb?`<div class="wpsl">${img(pa,'pointer-events:none')}${img(pb,`clip-path:inset(0 0 0 ${WPX}%);pointer-events:none`)}<div class="wpln" style="left:${WPX}%"></div><span class="wptg l">${wmLab(WPA)}</span><span class="wptg r">${wmLab(WPB)}</span>
       <input type="range" min="0" max="100" value="${WPX}" oninput="WPX=+this.value;const s=this.parentNode;s.querySelectorAll('img')[1].style.clipPath='inset(0 0 0 '+WPX+'%)';s.querySelector('.wpln').style.left=WPX+'%'"></div>`:''}</div></div>`:'<div class="card mu">有兩個月以上的照片，就會出現並排比較和滑桿</div>'}`}
   <div class="mu" style="margin-top:8px">🔒 照片用資料密碼加密後才上傳，別人打不開；教練報告不會放照片。</div>`;
  document.querySelectorAll('#app img[data-ph]').forEach(async im=>{const p=L.find(x=>x.id===im.dataset.ph);try{const u=await phUrl(p);if(u)im.src=u;}catch(e){}});}
// ══ P3：同一排兩組分頁（訓練＝灰底、身體與報告＝淡紫底）；右邊按鈕縮成小圖示 ══
const TAB_ROWS=[['訓練',['ov','log','ex','mgr']],['身體',['ib','ph','rp']]];
const TAB_SHORT={log:'📒 日誌',ex:'💪 進步',mgr:'⚙️ 動作'};
tabs=function(){const N=Object.fromEntries(TABS);const used=new Set(TAB_ROWS.flatMap(r=>r[1]));const rows=TAB_ROWS.map(r=>[r[0],r[1].filter(k=>N[k])]);
  const rest=TABS.map(t=>t[0]).filter(k=>!used.has(k));if(rest.length)rows[0][1].push(...rest);
  $('tabs').innerHTML=rows.map(([lab,ks],i)=>`<div class="tgrp${i?' g2':''}" title="${lab}">${ks.map(k=>`<span class="${k===TAB?'on':''}" title="${N[k].replace(/^\S+\s/,'')}" onclick="TAB='${k}';render()">${TAB_SHORT[k]||N[k]}</span>`).join('')}</div>`).join('');};
(()=>{const top=document.querySelector('.top');if(!top)return;const ic={'📥':'貼上匯入','📱':'手機版','🏠':'主目錄'};
  top.querySelectorAll(':scope > .tb, :scope > a').forEach(b=>{const t=b.textContent.trim(),e=t.split(/\s/)[0];if(ic[e]){b.title=ic[e];b.textContent=e;b.classList.add('tic');}else if(/補記/.test(t)){b.textContent='＋ 補記';b.title='補記一次訓練';}});})();
// ══ A：總覽最上面「今天一定要練」大橫幅＋照片／腹肌過期的實心提醒條 ══
const _heroRender0=render;
render=function(){_heroRender0();if(TAB==='ov'){try{webHero();}catch(e){console.warn('hero',e);}}};
function webHero(){const app=$('app');if(!app||app.querySelector('.wbars'))return;const T=today(),PN=phNagLv(),AN=absNagLv(T);
  let h='';
  const bars=[];
  if(PN)bars.push(`<div class="wbar ph${PN.strong?' strong':''}" onclick="TAB='ph';render()"><span style="font-size:22px">📸</span><div><b>${PN.strong?'<i class="pls"></i>':''}${+PN.m.slice(5)} 月身形照還沒拍</b><div class="sm">${PN.strong?'已經第 '+PN.day+' 天了・':''}月初拍最準</div></div><button>上傳</button></div>`);
  if(AN&&AN.strong)bars.push(`<div class="wbar ab strong">${absIcon(34,'#fff')}<div><b><i class="pls"></i>⚠️ 腹肌已經 ${AN.A.n} 天沒練了</b><div class="sm">上次 ${md(AN.A.last)}（${AN.A.n} 天前）</div></div><button onclick="event.stopPropagation();dayEdit(today(),'abs')">✏️ 記錄腹肌</button></div>`);
  const rn=document.getElementById('rpnag');
  if(bars.length||rn){app.insertAdjacentHTML('afterbegin',`<div class="wbars">${bars.join('')}</div>`);const wb=app.querySelector('.wbars');if(rn){rn.classList.add('inrow');wb.appendChild(rn);}}}

function heroCard(T){const H=heroPlan(T),SG=H.SG;if(!SG)return'';
  const sub=(H.DN?`✓ 今天 ${H.DN.name} 練完了（${H.DN.sets} 組）<br>`:'')+SG.items.map(x=>x.name+(x.n==null?' 還沒練過':' 隔 '+x.n+' 天')).join(H.DN?'・':'<br>');
  return`<div class="whc"><div><div class="hk">${H.lab==='今天'?'💪':'📅'} ${H.lab}訓練項目</div><div class="ht">${SG.name}</div></div><div class="hs">${sub}</div>${H.lab==='今天'?`<button onclick="emb('')">📱 用手機開始</button>`:''}</div>`;}
// ══ V2 總覽：體重／體脂小圖、體脂目標、提醒併一排 ══
function setFatGoal(){const g=+(db.cfg&&db.cfg.fatGoal)||13;const v=prompt('體脂目標（%）',g);if(v==null)return;const n=parseFloat(v);if(!(n>3&&n<40)){alert('請輸入 3～40 之間的數字');return;}db.cfg=touch({...(db.cfg||{}),fatGoal:n});save();render();}
function drawIbTr(){const cv=document.getElementById('ibtr');if(!cv||typeof Chart==='undefined')return;const L=db.inbody.slice().sort((a,b)=>a.date.localeCompare(b.date));if(L.length<2)return;
  const g=+(db.cfg&&db.cfg.fatGoal)||13,num=v=>v===''||v==null?null:+v;
  CH.ib=new Chart(cv,{type:'line',data:{labels:L.map(x=>md(x.date)),datasets:[
    {label:'體重 kg',data:L.map(x=>num(x.wt)),borderColor:'#2563eb',backgroundColor:'#2563eb',yAxisID:'y',tension:.3,pointRadius:3,spanGaps:true},
    {label:'體脂 %',data:L.map(x=>num(x.fat)),borderColor:'#f59e0b',backgroundColor:'#f59e0b',yAxisID:'y2',tension:.3,pointRadius:3,spanGaps:true},
    {label:`目標 ${g}%`,data:L.map(()=>g),borderColor:'#0891b2',borderDash:[5,4],borderWidth:1.5,pointRadius:0,yAxisID:'y2'}]},
   options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},
    scales:{y:{position:'left',title:{display:true,text:'kg'},grace:'10%'},y2:{position:'right',title:{display:true,text:'%'},grid:{drawOnChartArea:false},suggestedMin:g-1,grace:'10%'}}}});}

(async function(){render();if(await pull())render();setInterval(async()=>{if(document.visibilityState==='visible'&&$('emb').style.display!=='flex'){if(await pull())render();}},60000);})();
</script>
